<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#020617">
  <title>Tặng Em Bé Mặt Trăng Nhỏ 🌕✨</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --text: #f7f2df;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at 50% 42%, #101a32 0%, #050a16 38%, #02040b 78%);
      color: var(--text);
      font-family: "Quicksand", sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      position: relative;
      isolation: isolate;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      cursor: default;
    }

    .ui-layer {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    .font-handwriting {
      font-family: "Dancing Script", cursive;
    }

    #introScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      transition: opacity 1100ms ease;
    }

    #introTextWrap {
      width: min(92vw, 900px);
      min-height: clamp(60px, 9vw, 110px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #typewriterText {
      margin: 0;
      color: rgba(255, 248, 220, .94);
      font-size: clamp(18px, 2.4vw, 34px);
      line-height: 1.5;
      letter-spacing: .045em;
      text-shadow: 0 0 18px rgba(255, 236, 164, .08), 0 2px 18px rgba(0,0,0,.35);
      font-weight: 500;
    }

    .blinking-cursor::after {
      content: "|";
      display: inline-block;
      margin-left: 3px;
      color: #fff0a8;
      animation: cursorBlink .78s steps(1) infinite;
    }

    @keyframes cursorBlink {
      0%, 45% { opacity: 1; }
      46%, 100% { opacity: 0; }
    }

    #cardModal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 4vw, 42px);
      background: rgba(1, 4, 11, .34);
      backdrop-filter: blur(0px);
      -webkit-backdrop-filter: blur(0px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 500ms ease, backdrop-filter 500ms ease, -webkit-backdrop-filter 500ms ease;
    }

    #cardModal.open {
      opacity: 1;
      pointer-events: auto;
      backdrop-filter: blur(13px) saturate(.78);
      -webkit-backdrop-filter: blur(13px) saturate(.78);
    }

    #cardContainer {
      width: min(720px, 92vw);
      min-height: clamp(260px, 38vh, 390px);
      max-height: 78vh;
      overflow: auto;
      padding: clamp(24px, 4vw, 42px);
      border-radius: 28px;
      background: radial-gradient(circle at 50% 0%, rgba(255, 218, 133, .09), transparent 45%), linear-gradient(145deg, rgba(21, 29, 51, .94), rgba(6, 11, 23, .91));
      border: 1px solid rgba(255, 231, 164, .18);
      box-shadow: 0 35px 100px rgba(0,0,0,.62), inset 0 1px 0 rgba(255,255,255,.05), 0 0 80px rgba(247, 201, 107, .055);
      transform: translateY(10px) scale(.96);
      opacity: 0;
      transition: transform 550ms cubic-bezier(.2,.8,.2,1), opacity 400ms ease;
    }

    #cardModal.open #cardContainer {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .card-top {
      text-align: center;
      margin-bottom: 20px;
    }

    .card-lantern {
      display: inline-flex;
      width: 42px;
      height: 42px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,205,105,.18), transparent 68%);
      font-size: 30px;
    }

    .card-title {
      margin: 5px 0 0;
      color: rgba(255,229,159,.88);
      font-size: clamp(22px, 3vw, 28px);
      font-weight: 600;
    }

    #cardText {
      width: 100%;
      margin: 0 auto;
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(248,248,244,.94);
      font-size: clamp(16px, 2vw, 20px);
      line-height: 1.9;
      text-align: center;
      white-space: pre-line;
    }

    #cardFooter {
      margin-top: 24px;
      text-align: center;
      opacity: 0;
      transition: opacity 900ms ease;
    }

    #cardFooter.show { opacity: 1; }

    #cardFooter p {
      margin: 0;
      color: rgba(222, 228, 241, .46);
      font-size: 12px;
    }

    #endingScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 24px;
      opacity: 0;
      transition: opacity 1200ms ease;
    }

    #endingScreen.visible { opacity: 1; }

    #endingText1, #endingText2 {
      margin: 0;
      opacity: 0;
      transition: opacity 1200ms ease;
    }

    #endingText1 {
      font-family: "Dancing Script", cursive;
      font-size: clamp(30px, 5vw, 58px);
      color: rgba(255,244,201,.96);
    }

    #endingText2 {
      margin-top: 20px;
      font-size: clamp(16px, 2.4vw, 23px);
      color: rgba(255,205,214,.82);
    }

    #endingText1.show, #endingText2.show { opacity: 1; }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background: radial-gradient(circle at 50% 46%, transparent 35%, rgba(0,0,0,.22) 100%);
    }
  </style>
</head>

<body>
  <canvas id="mainCanvas"></canvas>
  <div class="vignette"></div>

  <div id="introScreen" class="ui-layer">
    <div id="introTextWrap">
      <p id="typewriterText"></p>
    </div>
  </div>

  <div id="cardModal">
    <div id="cardContainer">
      <div class="card-top">
        <span class="card-lantern">🏮</span>
        <h3 class="card-title font-handwriting">Một lời nhắn gửi em bé</h3>
      </div>
      <p id="cardText"></p>
      <div id="cardFooter">
        <p>Chạm ra ngoài để khép lại.</p>
      </div>
    </div>
  </div>

  <div id="endingScreen" class="ui-layer">
    <p id="endingText1">Trung Thu Vui Vẻ Nhé</p>
    <p id="endingText2">Em Bé Của Em ❤️</p>
  </div>

<script>
"use strict";

const LANTERN_LIMIT = 3;
const GREETINGS = [
  "Gửi em bé,\nChúc em có một đêm Trung Thu thật ấm áp và tràn ngập niềm vui ✨\nDù bầu trời ngoài kia có rộng lớn thế nào, em vẫn luôn là điều đặc biệt nhất.",
  "Cảm ơn em đã xuất hiện và làm cho những ngày bình thường trở nên thật ngọt ngào 🌕\nMong cho nụ cười của em bé luôn rạng rỡ như ánh trăng đêm nay.",
  "Mặt trăng nhỏ này là dành riêng cho em đấy ❤️\nHy vọng chúng ta sẽ cùng nhau đi qua thật nhiều mùa Trung Thu trọn vẹn và hạnh phúc hơn nữa."
];

const STATES = Object.freeze({
  INTRO_TYPING: "INTRO_TYPING",
  DOT_BLINKING: "DOT_BLINKING",
  MOON_AWAKENING: "MOON_AWAKENING",
  INTERACTIVE_SKY: "INTERACTIVE_SKY",
  WAITING_LANTERNS_CLEAR: "WAITING_LANTERNS_CLEAR",
  MOON_GLOWING_UP: "MOON_GLOWING_UP",
  MOON_SHRINKING: "MOON_SHRINKING",
  CAMERA_PANNING: "CAMERA_PANNING",
  FIREWORKS_SHOW: "FIREWORKS_SHOW",
  FIREWORKS_PAUSE: "FIREWORKS_PAUSE",
  LOVE_FOREVER_BURST: "LOVE_FOREVER_BURST",
  ENDING_TEXT: "ENDING_TEXT"
});

let currentState = STATES.INTRO_TYPING;
let lanternClicks = 0;
let activeCardOpen = false;
let width = 0, height = 0, dpr = 1;
let cameraOffsetY = 0, targetCameraOffsetY = 0;

let stars = [], lanterns = [], fireworks = [], particles = [], textParticles = [];

const canvas = document.getElementById("mainCanvas");
const ctx = canvas.getContext("2d");

const introScreen = document.getElementById("introScreen");
const typewriterText = document.getElementById("typewriterText");
const cardModal = document.getElementById("cardModal");
const cardText = document.getElementById("cardText");
const cardFooter = document.getElementById("cardFooter");
const endingScreen = document.getElementById("endingScreen");
const endingText1 = document.getElementById("endingText1");
const endingText2 = document.getElementById("endingText2");

const sleep = ms => new Promise(res => setTimeout(res, ms));
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const lerp = (a, b, t) => a + (b - a) * t;
const random = (min, max) => min + Math.random() * (max - min);

function easeOutQuart(t) { return 1 - Math.pow(1 - clamp(t, 0, 1), 4); }
function easeInOutCubic(t) {
  t = clamp(t, 0, 1);
  return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  canvas.style.width = width + "px";
  canvas.style.height = height + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  createStars();
  moon.x = width * .5;
  if (!moon.lockY) moon.y = height * .47;
  moon.targetRadius = getMoonRadius();
}
window.addEventListener("resize", resize);

const moon = {
  x: 0, y: 0, radius: 1.5, targetRadius: 80,
  opacity: 0, glowOpacity: 0, hoverAmount: 0,
  isAwake: false, lockY: false
};

function getMoonRadius() { return clamp(Math.min(width, height) * .115, 48, 94); }

function drawMoon() {
  if (moon.opacity <= 0) return;
  const r = moon.radius * (1 + moon.hoverAmount * .055);

  ctx.save();
  const outerGlow = r * 3.7;
  const glow = ctx.createRadialGradient(moon.x, moon.y, r * .12, moon.x, moon.y, outerGlow);
  glow.addColorStop(0, `rgba(255,245,179,${.25 * moon.glowOpacity})`);
  glow.addColorStop(.48, `rgba(255,205,85,${.055 * moon.glowOpacity})`);
  glow.addColorStop(1, "rgba(255,205,85,0)");

  ctx.globalAlpha = moon.opacity;
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(moon.x, moon.y, outerGlow, 0, Math.PI * 2);
  ctx.fill();

  const body = ctx.createRadialGradient(moon.x - r * .34, moon.y - r * .38, r * .08, moon.x, moon.y, r);
  body.addColorStop(0, "#fffdf0");
  body.addColorStop(.45, "#fff7c5");
  body.addColorStop(1, "#f5cf65");

  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.arc(moon.x, moon.y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function createStars() {
  stars = [];
  const count = clamp(Math.floor(width * height / 6500), 70, 210);
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * width,
      y: Math.random() * height,
      size: random(.35, 1.35),
      alpha: random(.18, .72),
      phase: Math.random() * Math.PI * 2,
      speed: random(.35, 1.2)
    });
  }
}

function drawStars(time) {
  for (const s of stars) {
    const twinkle = .75 + Math.sin(time * .001 * s.speed + s.phase) * .25;
    ctx.globalAlpha = s.alpha * twinkle;
    ctx.fillStyle = "#ebf1ff";
    ctx.beginPath();
    ctx.arc(s.x, s.y + cameraOffsetY * .03, s.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function createLantern() {
  const scale = random(.72, 1.15);
  return {
    x: random(width * .06, width * .94),
    y: height + random(40, 180),
    speedY: random(10, 18),
    swayAmplitude: random(4, 9),
    swaySpeed: random(.16, .32),
    swayPhase: Math.random() * Math.PI * 2,
    size: 29 * scale,
    alpha: random(.66, .92),
    fade: 1
  };
}

function spawnLanterns() {
  lanterns = [];
  for (let i = 0; i < 14; i++) {
    setTimeout(() => {
      if (currentState === STATES.INTERACTIVE_SKY || currentState === STATES.WAITING_LANTERNS_CLEAR) {
        lanterns.push(createLantern());
      }
    }, i * 720 + random(0, 320));
  }
}

function drawLantern(l, time) {
  const x = l.x + Math.sin(time * .001 * l.swaySpeed + l.swayPhase) * l.swayAmplitude;
  const y = l.y;
  const s = l.size;

  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = l.alpha * l.fade;

  const body = ctx.createLinearGradient(-s*.5, 0, s*.5, 0);
  body.addColorStop(0, "#b94b27");
  body.addColorStop(.5, "#ff9b45");
  body.addColorStop(1, "#9f3d24");

  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.roundRect(-s*.46, -s*.58, s*.92, s*1.16, s*.17);
  ctx.fill();
  ctx.restore();
}

function updateLanterns(dt) {
  for (let i = lanterns.length - 1; i >= 0; i--) {
    const l = lanterns[i];
    l.y -= l.speedY * dt;
    if (l.y < -80) {
      if (currentState === STATES.INTERACTIVE_SKY) lanterns[i] = createLantern();
      else lanterns.splice(i, 1);
    }
  }

  if (currentState === STATES.WAITING_LANTERNS_CLEAR && lanterns.length === 0) {
    currentState = STATES.MOON_GLOWING_UP;
    moon.glowOpacity = 1;
  }
}

const introLines = [
  "25-9-2026",
  "Rằm tháng 8 rồi đấy",
  "Thế em bé đã có quà gì chưa",
  "Tặng em bé một mặt trăng nhỏ nhé!"
];

async function runIntroTypewriter() {
  currentState = STATES.INTRO_TYPING;
  introScreen.style.display = "flex";
  typewriterText.classList.add("blinking-cursor");

  for (let lineIndex = 0; lineIndex < introLines.length; lineIndex++) {
    const line = introLines[lineIndex];
    for (let i = 0; i <= line.length; i++) {
      typewriterText.textContent = line.slice(0, i);
      await sleep(random(42, 76));
    }
    await sleep(1500);

    if (lineIndex < introLines.length - 1) {
      for (let i = line.length; i >= 0; i--) {
        typewriterText.textContent = line.slice(0, i);
        await sleep(random(27, 42));
      }
      await sleep(260);
    }
  }

  typewriterText.classList.remove("blinking-cursor");
  introScreen.style.opacity = "0";
  await sleep(1150);
  introScreen.style.display = "none";
  startDotSequence();
}

function startDotSequence() {
  currentState = STATES.DOT_BLINKING;
  let count = 0;
  const interval = setInterval(() => {
    moon.opacity = moon.opacity > .1 ? 0 : .92;
    count++;
    if (count >= 6) {
      clearInterval(interval);
      startMoonAwakening();
    }
  }, 360);
}

function startMoonAwakening() {
  currentState = STATES.MOON_AWAKENING;
  const startR = 1.6;
  const endR = getMoonRadius();
  const start = performance.now();
  moon.opacity = 1;

  function frame(now) {
    const p = clamp((now - start) / 4200, 0, 1);
    moon.radius = lerp(startR, endR, easeOutQuart(p));
    moon.glowOpacity = lerp(.08, .78, easeOutQuart(p));
    if (p < 1) requestAnimationFrame(frame);
    else moon.isAwake = true;
  }
  requestAnimationFrame(frame);
}

async function openGreetingCard(index) {
  if (activeCardOpen || index >= GREETINGS.length) return;
  activeCardOpen = true;
  cardText.textContent = "";
  cardModal.classList.add("open");

  const text = GREETINGS[index];
  for (let i = 0; i <= text.length; i++) {
    if (!activeCardOpen) return;
    cardText.textContent = text.slice(0, i);
    await sleep(random(28, 44));
  }
  cardFooter.classList.add("show");
}

function closeGreetingCard() {
  if (!activeCardOpen) return;
  activeCardOpen = false;
  cardModal.classList.remove("open");
  cardFooter.classList.remove("show");

  lanternClicks = Math.min(lanternClicks + 1, LANTERN_LIMIT);
  if (lanternClicks >= LANTERN_LIMIT) {
    currentState = STATES.WAITING_LANTERNS_CLEAR;
  }
}

cardModal.addEventListener("click", e => {
  if (e.target === cardModal) closeGreetingCard();
});

canvas.addEventListener("click", e => {
  if (activeCardOpen) return;
  const x = e.clientX, y = e.clientY - cameraOffsetY;

  if (currentState === STATES.MOON_AWAKENING) {
    if (Math.hypot(x - moon.x, y - moon.y) < moon.radius * 1.5) {
      currentState = STATES.INTERACTIVE_SKY;
      spawnLanterns();
    }
  } else if (currentState === STATES.INTERACTIVE_SKY) {
    for (let i = lanterns.length - 1; i >= 0; i--) {
      const l = lanterns[i];
      if (Math.hypot(x - l.x, y - l.y) < l.size * 1.35) {
        lanterns.splice(i, 1);
        openGreetingCard(lanternClicks);
        break;
      }
    }
  } else if (currentState === STATES.MOON_GLOWING_UP) {
    if (Math.hypot(x - moon.x, y - moon.y) < moon.radius * 1.55) {
      triggerOutroSequence();
    }
  }
});

async function triggerOutroSequence() {
  currentState = STATES.MOON_SHRINKING;
  const startR = moon.radius, start = performance.now();

  await new Promise(res => {
    function frame(now) {
      const p = clamp((now - start) / 1400, 0, 1);
      moon.radius = lerp(startR, 7, easeInOutCubic(p));
      if (p < 1) requestAnimationFrame(frame);
      else res();
    }
    requestAnimationFrame(frame);
  });

  await sleep(2000);
  currentState = STATES.ENDING_TEXT;
  endingScreen.classList.add("visible");
  endingText1.classList.add("show");
  await sleep(3200);
  endingText1.classList.remove("show");
  await sleep(1000);
  endingText2.classList.add("show");
  await sleep(4000);
  endingText2.classList.remove("show");
  endingScreen.classList.remove("visible");
}

/* Loop */
let lastTime = performance.now();
function loop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  ctx.clearRect(0, 0, width, height);

  ctx.save();
  ctx.translate(0, cameraOffsetY);

  drawStars(now);
  drawMoon();

  updateLanterns(dt);
  for (const l of lanterns) drawLantern(l, now);

  ctx.restore();

  requestAnimationFrame(loop);
}

/* Init */
resize();
runIntroTypewriter();
requestAnimationFrame(loop);
</script>
</body>
</html>
