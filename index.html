<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đêm Trăng & Pháo Hoa I Love You</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh;
            overflow: hidden;
            background: #02050e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        .sky-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, #1b2735 0%, #02050e 100%);
            z-index: 1;
        }

        #fireworks-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 5;
            pointer-events: none;
        }

        #moon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            z-index: 20;
            width: 360px;
            height: 360px;
            border-radius: 50%;
            cursor: pointer;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #fff3a0 50%, #fbc531 100%);
            box-shadow: 0 0 40px rgba(251, 197, 49, 0.4);
            filter: brightness(1);
            transition: filter 3s ease, 
                        box-shadow 3s ease, 
                        transform 5s cubic-bezier(0.4, 0, 0.2, 1), 
                        top 3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        #moon:hover {
            filter: brightness(1.5);
            box-shadow: 0 0 100px #fff, 0 0 140px #fbc531;
        }

        #moon.is-clicked {
            filter: brightness(1.5) !important;
            box-shadow: 0 0 100px #fff, 0 0 140px #fbc531 !important;
            cursor: default;
        }

        #moon.shrink {
            transform: translate(-50%, -50%) scale(0.43) !important;
        }

        #moon.move-up {
            top: 22% !important;
        }

        #bottom-scene {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            opacity: 0;
            transition: opacity 2.5s ease;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        #bottom-scene.show { opacity: 1; }

        .couple-silhouette {
            position: relative;
            z-index: 16;
            margin-bottom: 0;
        }

        #hint {
            position: fixed;
            bottom: 40px;
            color: #ffeaa7;
            font-size: 1.1rem;
            z-index: 30;
            pointer-events: none;
            opacity: 0.8;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

    <div class="sky-bg"></div>
    <canvas id="fireworks-canvas"></canvas>

    <div id="moon" onclick="startSequence()"></div>

    <div id="bottom-scene">
        <svg class="couple-silhouette" width="220" height="150" viewBox="0 0 220 150">
            <circle cx="85" cy="45" r="24" fill="#1e293b"/>
            <path d="M 35,150 C 35,90 60,75 100,75 C 130,75 135,100 135,150 Z" fill="#1e293b"/>
            <circle cx="135" cy="55" r="20" fill="#1e293b"/>
            <path d="M 105,150 C 105,98 125,88 158,90 C 185,98 190,120 198,150 Z" fill="#1e293b"/>
        </svg>
    </div>

    <div id="hint">Click vào Mặt Trăng để bắt đầu</div>

    <script>
        const moon = document.getElementById('moon');
        const hint = document.getElementById('hint');
        const bottomScene = document.getElementById('bottom-scene');
        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let isStarted = false;

        function startSequence() {
            if (isStarted) return;
            isStarted = true;

            moon.classList.add('is-clicked');
            hint.style.opacity = '0';

            setTimeout(() => {
                moon.classList.add('shrink');

                setTimeout(() => {
                    moon.classList.add('move-up');
                    bottomScene.classList.add('show');

                    setTimeout(() => {
                        startFireworksPhase1();
                    }, 2000);

                }, 4000);

            }, 2000);
        }

        let particles = [];
        let rockets = [];

        function animate() {
            requestAnimationFrame(animate);
            ctx.fillStyle = 'rgba(2, 5, 14, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = rockets.length - 1; i >= 0; i--) {
                rockets[i].update();
                rockets[i].draw();
                if (rockets[i].exploded) {
                    rockets.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }
        animate();

        class Rocket {
            constructor(targetX, targetY, burstPoints = null) {
                this.x = targetX;
                this.y = canvas.height;
                this.targetX = targetX;
                this.targetY = targetY;
                this.speed = 15;
                this.vy = -this.speed;
                this.exploded = false;
                this.burstPoints = burstPoints;
            }

            update() {
                this.y += this.vy;

                if (this.y <= this.targetY) {
                    this.exploded = true;
                    if (this.burstPoints) {
                        createFireworksText(this.burstPoints);
                    } else {
                        explodeNormal(this.x, this.targetY);
                    }
                }
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = '#ffeaa7';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#fff';
                ctx.fill();
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color, vx, vy) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = vx;
                this.vy = vy;
                this.alpha = 1;
                this.friction = 0.95;
                this.gravity = 0.03;
            }

            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.008;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2.2, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 6;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        function explodeNormal(x, y) {
            const colors = ['#ff7675', '#fd79a8', '#ffeaa7', '#74b9ff', '#55efc4'];
            const count = 50;
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 8 + 2;
                const color = colors[Math.floor(Math.random() * colors.length)];
                particles.push(new Particle(x, y, color, Math.cos(angle) * speed, Math.sin(angle) * speed));
            }
        }

        let phase1Count = 0;
        function startFireworksPhase1() {
            if (phase1Count >= 4) {
                setTimeout(() => {
                    startFireworksTextPhase();
                }, 1000);
                return;
            }

            for (let i = 0; i < 2; i++) {
                setTimeout(() => {
                    const targetX = canvas.width * (0.2 + Math.random() * 0.6);
                    const targetY = canvas.height * (0.2 + Math.random() * 0.25);
                    rockets.push(new Rocket(targetX, targetY));
                }, i * 250);
            }

            phase1Count++;
            setTimeout(startFireworksPhase1, 1200);
        }

        function startFireworksTextPhase() {
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            
            tempCanvas.width = 1600;
            tempCanvas.height = 400;

            tempCtx.font = 'bold 160px "Segoe UI", Arial, sans-serif';
            tempCtx.fillStyle = '#ffffff';
            tempCtx.textAlign = 'center';
            tempCtx.textBaseline = 'middle';
            tempCtx.fillText('I LOVE YOU', 800, 200);

            const imgData = tempCtx.getImageData(0, 0, 1600, 400);
            const centerX = canvas.width / 2;
            const centerY = canvas.height * 0.42;

            const burstPoints = [];
            const step = 26;

            for (let y = 0; y < 400; y += step) {
                for (let x = 0; x < 1600; x += step) {
                    const index = (y * 1600 + x) * 4;
                    if (imgData.data[index + 3] > 128) {
                        const px = centerX + (x - 800);
                        const py = centerY + (y - 200);
                        burstPoints.push({ x: px, y: py });
                    }
                }
            }

            const launchCols = [0.2, 0.35, 0.5, 0.65, 0.8];
            launchCols.forEach((colRatio, index) => {
                setTimeout(() => {
                    const targetX = canvas.width * colRatio;
                    const targetY = centerY;
                    rockets.push(new Rocket(targetX, targetY, index === 2 ? burstPoints : null));
                }, index * 120);
            });
        }

        function createFireworksText(points) {
            const colorPalettes = [
                ['#ff7675', '#ffeaa7'],
                ['#74b9ff', '#81ecec'],
                ['#fd79a8', '#e84393'],
                ['#55efc4', '#00b894'],
                ['#fdcb6e', '#e17055']
            ];

            points.forEach(pt => {
                const palette = colorPalettes[Math.floor(Math.random() * colorPalettes.length)];
                const particleCount = 20;

                for (let i = 0; i < particleCount; i++) {
                    const angle = (Math.PI * 2 / particleCount) * i;
                    const speed = 2.5 + Math.random() * 2.5;
                    const color = palette[Math.floor(Math.random() * palette.length)];

                    particles.push(new Particle(
                        pt.x, 
                        pt.y, 
                        color, 
                        Math.cos(angle) * speed, 
                        Math.sin(angle) * speed
                    ));
                }
            });
        }
    </script>
</body>
</html>
