<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đêm Trăng & Pháo Hoa I Love You</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh;
            overflow: hidden;
            background: #02050e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        .sky-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, #1b2735 0%, #02050e 100%);
            z-index: 1;
        }

        #fireworks-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 5;
            pointer-events: none;
        }

        #moon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            z-index: 20;
            width: 360px;
            height: 360px;
            border-radius: 50%;
            cursor: pointer;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #fff3a0 50%, #fbc531 100%);
            box-shadow: 0 0 40px rgba(251, 197, 49, 0.4);
            filter: brightness(1);
            transition: filter 3s ease, 
                        box-shadow 3s ease, 
                        transform 5s cubic-bezier(0.4, 0, 0.2, 1), 
                        top 3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        #moon:hover {
            filter: brightness(1.5);
            box-shadow: 0 0 100px #fff, 0 0 140px #fbc531;
        }

        #moon.is-clicked {
            filter: brightness(1.5) !important;
            box-shadow: 0 0 100px #fff, 0 0 140px #fbc531 !important;
            cursor: default;
        }

        #moon.shrink {
            transform: translate(-50%, -50%) scale(0.43) !important;
        }

        #moon.move-up {
            top: 22% !important;
        }

        /* KHU VỰC BÓNG NGƯỜI - ĐÃ XOÁ SẠCH PHẦN ĐẤT THỪA 2 BÊN */
        #bottom-scene {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            opacity: 0;
            transition: opacity 2.5s ease;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        #bottom-scene.show { opacity: 1; }

        .couple-silhouette {
            position: relative;
            z-index: 16;
            margin-bottom: 0;
        }

        #hint {
            position: fixed;
            bottom: 40px;
            color: #ffeaa7;
            font-size: 1.1rem;
            z-index: 30;
            pointer-events: none;
            opacity: 0.8;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

    <div class="sky-bg"></div>
    <canvas id="fireworks-canvas"></canvas>

    <div id="moon" onclick="startSequence()"></div>

    <!-- CHỈ CÒN LẠI ĐÚNG BÓNG 2 NGƯỜI NHỎ GỌN -->
    <div id="bottom-scene">
        <svg class="couple-silhouette" width="220" height="150" viewBox="0 0 220 150">
            <circle cx="85" cy="45" r="24" fill="#1e293b"/>
            <path d="M 35,150 C 35,90 60,75 100,75 C 130,75 135,100 135,150 Z" fill="#1e293b"/>
            <circle cx="135" cy="55" r="20" fill="#1e293b"/>
            <path d="M 105,150 C 105,98 125,88 158,90 C 185,98 190,120 198,150 Z" fill="#1e293b"/>
        </svg>
    </div>

    <div id="hint">Rê chuột làm sáng 3s, click vào Mặt Trăng để bắt đầu</div>

    <script>
        const moon = document.getElementById('moon');
        const hint = document.getElementById('hint');
        const bottomScene = document.getElementById('bottom-scene');
        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let isStarted = false;

        function startSequence() {
            if (isStarted) return;
            isStarted = true;

            moon.classList.add('is-clicked');
            hint.style.opacity = '0';

            setTimeout(() => {
                moon.classList.add('shrink');

                setTimeout(() => {
                    moon.classList.add('move-up');
                    bottomScene.classList.add('show');

                    setTimeout(() => {
                        startFireworksPhase1();
                    }, 4000);

                }, 5000 + 2000);

            }, 3000);
        }

        let particles = [];
        let rockets = [];

        function animate() {
            requestAnimationFrame(animate);
            ctx.fillStyle = 'rgba(2, 5, 14, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = rockets.length - 1; i >= 0; i--) {
                rockets[i].update();
                rockets[i].draw();
                if (rockets[i].exploded) {
                    rockets.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }
        animate();

        class Rocket {
            constructor(startX, startY, targetX, targetY, letterGroup = null) {
                this.x = startX;
                this.y = startY;
                this.targetX = targetX;
                this.targetY = targetY;
                this.speed = 12;
                this.angle = Math.atan2(targetY - startY, targetX - startX);
                this.vx = Math.cos(this.angle) * this.speed;
                this.vy = Math.sin(this.angle) * this.speed;
                this.exploded = false;
                this.letterGroup = letterGroup;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (Math.hypot(this.targetX - this.x, this.targetY - this.y) < 15) {
                    this.exploded = true;
                    if (this.letterGroup) {
                        explodeLetter(this.letterGroup);
                    } else {
                        explodeNormal(this.x, this.y);
                    }
                }
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = '#ffeaa7';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#fff';
                ctx.fill();
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color, vx, vy, friction = 0.95, gravity = 0.05) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = vx;
                this.vy = vy;
                this.alpha = 1;
                this.friction = friction;
                this.gravity = gravity;
            }

            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.008;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2.2, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 6;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        function explodeNormal(x, y) {
            const colors = ['#ff7675', '#fd79a8', '#ffeaa7', '#74b9ff', '#55efc4'];
            const count = 40 + Math.floor(Math.random() * 20);
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 7 + 2;
                const color = colors[Math.floor(Math.random() * colors.length)];
                particles.push(new Particle(x, y, color, Math.cos(angle) * speed, Math.sin(angle) * speed));
            }
        }

        let phase1Count = 0;
        function startFireworksPhase1() {
            if (phase1Count >= 8) {
                setTimeout(() => {
                    startFireworksTextPhase();
                }, 1000);
                return;
            }

            const waveRockets = 2 + Math.floor(Math.random() * 3);
            for (let i = 0; i < waveRockets; i++) {
                setTimeout(() => {
                    const startX = canvas.width * (0.15 + Math.random() * 0.7);
                    const targetX = startX + (Math.random() * 80 - 40);
                    const targetY = canvas.height * (0.2 + Math.random() * 0.25);
                    rockets.push(new Rocket(startX, canvas.height, targetX, targetY));
                }, i * 200);
            }

            phase1Count++;
            setTimeout(startFireworksPhase1, 1400);
        }

        // BẮN PHÁO HOA TỰ NỔ CHỮ
        function startFireworksTextPhase() {
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = 900;
            tempCanvas.height = 200;

            tempCtx.font = 'bold 90px "Segoe UI", Arial, sans-serif';
            tempCtx.fillStyle = '#ffffff';
            tempCtx.textAlign = 'center';
            tempCtx.textBaseline = 'middle';
            tempCtx.fillText('I LOVE YOU', 450, 100);

            const imgData = tempCtx.getImageData(0, 0, 900, 200);
            const centerX = canvas.width / 2;
            const centerY = canvas.height * 0.45;

            // Nhóm hạt theo từng khu vực chữ
            const letterGroups = Array.from({ length: 10 }, () => []);

            for (let y = 0; y < 200; y += 4) {
                for (let x = 0; x < 900; x += 4) {
                    const index = (y * 900 + x) * 4;
                    if (imgData.data[index + 3] > 128) {
                        const px = centerX + (x - 450);
                        const py = centerY + (y - 100);

                        // Chia điểm theo 10 quả tên lửa dọc chiều ngang
                        const groupIdx = Math.min(9, Math.floor((x / 900) * 10));
                        letterGroups[groupIdx].push({ x: px, y: py });
                    }
                }
            }

            // Bắn 10 quả tên lửa lên đúng vị trí 10 cụm chữ
            for (let i = 0; i < 10; i++) {
                if (letterGroups[i].length === 0) continue;

                // Tính tâm nổ của cụm hạt chữ này
                let avgX = 0, avgY = 0;
                letterGroups[i].forEach(p => { avgX += p.x; avgY += p.y; });
                avgX /= letterGroups[i].length;
                avgY /= letterGroups[i].length;

                const startX = canvas.width * (0.1 + (i / 9) * 0.8);
                
                setTimeout(() => {
                    rockets.push(new Rocket(startX, canvas.height, avgX, avgY, letterGroups[i]));
                }, i * 150); // Bắn nối đuôi nhau cực đẹp
            }
        }

        // KHI TÊN LỬA TỚI ĐÍCH -> NỔ TUNG RA CHỮ CỦA NÓ
        function explodeLetter(points) {
            const colors = ['#ff7675', '#fd79a8', '#ffeaa7', '#ffffff', '#fdcb6e'];

            points.forEach(p => {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 2;
                const color = colors[Math.floor(Math.random() * colors.length)];

                particles.push(new Particle(
                    p.x, p.y, color,
                    Math.cos(angle) * speed,
                    Math.sin(angle) * speed,
                    0.93, 0.02
                ));
            });
        }
    </script>
</body>
</html>
