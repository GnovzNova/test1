<script>
"use strict";

/* =========================================================
   CONFIG
========================================================= */

const LANTERN_LIMIT = 3;

const INTRO_LINES = [
    "25-9-2026",
    "Rằm tháng 8 rồi đấy",
    "Thế em bé đã có quà gì chưa",
    "Tặng em bé một mặt trăng nhỏ nhé!"
];

const GREETINGS = [
    "Chúc em bé có một đêm Trung Thu thật vui,\nthật ấm áp và thật nhiều tiếng cười ✨",

    "Mong những ngày phía trước của em\nluôn có thật nhiều điều dịu dàng tìm đến 🌕",

    "Và nếu có một điều ước trong đêm nay,\nthì em hãy giữ nó thật lâu nhé ❤️"
];

/* =========================================================
   STATE
========================================================= */

const STATES = {
    INTRO: "INTRO",
    MOON_APPEAR: "MOON_APPEAR",
    SKY: "SKY",
    WAIT_LANTERNS: "WAIT_LANTERNS",
    MOON_READY: "MOON_READY",
    MOON_SHRINK: "MOON_SHRINK",
    CAMERA: "CAMERA",
    FIREWORKS: "FIREWORKS",
    FIREWORKS_PAUSE: "FIREWORKS_PAUSE",
    LOVE_FOREVER: "LOVE_FOREVER",
    ENDING: "ENDING"
};

let state = STATES.INTRO;

let lanternClicks = 0;
let activeCard = false;

/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;

let cameraOffsetY = 0;
let targetCameraOffsetY = 0;

function resize() {

    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    createStars();
}

window.addEventListener("resize", resize);


/* =========================================================
   HELPERS
========================================================= */

const clamp = (v, a, b) =>
    Math.max(a, Math.min(b, v));

const lerp = (a, b, t) =>
    a + (b - a) * t;

const easeOutCubic = t =>
    1 - Math.pow(1 - t, 3);

const easeInOut = t =>
    0.5 - Math.cos(Math.PI * t) / 2;

const sleep = ms =>
    new Promise(resolve => setTimeout(resolve, ms));

function random(a, b) {
    return a + Math.random() * (b - a);
}


/* =========================================================
   STARS
========================================================= */

let stars = [];

function createStars() {

    stars = [];

    const amount = Math.floor((W * H) / 5500);

    for (let i = 0; i < amount; i++) {

        stars.push({
            x: Math.random() * W,
            y: Math.random() * H * 1.5,

            radius: random(.35, 1.15),

            alpha: random(.18, .7),

            twinkle: random(.4, 1.2),

            phase: Math.random() * Math.PI * 2
        });
    }
}


/* =========================================================
   MOON
========================================================= */

const moon = {

    x: 0,
    y: 0,

    radius: 2,

    targetRadius: 80,

    opacity: 0,

    glow: 0,

    hover: false,

    hoverAmount: 0,

    /* once clicked, hover animation is permanently disabled */
    hoverLocked: false
};


function resetMoon() {

    moon.x = W / 2;
    moon.y = H / 2;

    moon.radius = 2;

    moon.targetRadius =
        clamp(Math.min(W, H) * .115, 52, 90);

    moon.opacity = 0;
    moon.glow = 0;

    moon.hover = false;
    moon.hoverAmount = 0;
    moon.hoverLocked = false;
}


/* =========================================================
   INTRO TYPEWRITER
========================================================= */

async function runIntro() {

    state = STATES.INTRO;

    lanternClicks = 0;

    resetMoon();

    const intro = document.getElementById("intro");
    const text = document.getElementById("introText");

    intro.style.opacity = "1";
    text.classList.add("type-cursor");

    for (let lineIndex = 0;
         lineIndex < INTRO_LINES.length;
         lineIndex++) {

        const line = INTRO_LINES[lineIndex];

        /* TYPE */

        for (let i = 0; i <= line.length; i++) {

            text.textContent =
                line.substring(0, i);

            await sleep(random(45, 80));
        }

        /* cursor stays */

        await sleep(900);

        /* BACKSPACE except final line */

        if (lineIndex < INTRO_LINES.length - 1) {

            for (let i = line.length; i >= 0; i--) {

                text.textContent =
                    line.substring(0, i);

                await sleep(32);
            }

            await sleep(250);
        }
    }

    await sleep(1100);

    text.classList.remove("type-cursor");

    intro.style.opacity = "0";

    await sleep(1000);

    intro.style.display = "none";

    startMoonDot();
}


/* =========================================================
   MOON DOT → MOON
========================================================= */

async function startMoonDot() {

    state = STATES.MOON_APPEAR;

    resetMoon();

    /* 3 slow blinks */

    for (let i = 0; i < 3; i++) {

        moon.opacity = .9;

        await sleep(430);

        moon.opacity = .08;

        await sleep(430);
    }

    moon.opacity = 1;

    const startRadius = 2;
    const start = performance.now();

    /* VERY SLOW moon expansion */

    await new Promise(resolve => {

        function animate(now) {

            const p =
                clamp((now - start) / 4800, 0, 1);

            const e = easeOutCubic(p);

            moon.radius =
                lerp(
                    startRadius,
                    moon.targetRadius,
                    e
                );

            moon.glow =
                lerp(0, .72, e);

            if (p < 1) {

                requestAnimationFrame(animate);

            } else {

                resolve();
            }
        }

        requestAnimationFrame(animate);
    });

    state = STATES.SKY;
    spawnLanterns();
}


/* =========================================================
   LANTERNS
========================================================= */

let lanterns = [];

/*
    IMPORTANT:

    Không sway.
    Không rotation.
    Không sine-wave.

    Chỉ bay thẳng lên.

    Spawn nối tiếp:
    0.0s
    0.75s
    1.5s
    2.25s
    ...

    Vì tốc độ chậm nên chúng sẽ tạo thành
    một dòng đèn rải rác.
*/

function createLantern() {

    const scale = random(.72, 1.04);

    return {

        x: random(W * .08, W * .92),

        y: H + random(35, 80),

        speed:
            random(17, 25),

        size:
            30 * scale,

        scale,

        alpha:
            random(.72, .94),

        clicked: false
    };
}


function spawnLanterns() {

    lanterns = [];

    const total = 16;

    for (let i = 0; i < total; i++) {

        setTimeout(() => {

            if (
                state === STATES.SKY ||
                state === STATES.WAIT_LANTERNS
            ) {

                lanterns.push(
                    createLantern()
                );
            }

        }, i * 760 + random(0, 180));
    }
}


function drawLantern(l) {

    ctx.save();

    ctx.translate(l.x, l.y);

    ctx.globalAlpha = l.alpha;

    const s = l.size;

    /* glow */

    const glow =
        ctx.createRadialGradient(
            0, 0,
            1,
            0, 0,
            s * 1.8
        );

    glow.addColorStop(
        0,
        "rgba(255,185,75,.38)"
    );

    glow.addColorStop(
        .45,
        "rgba(255,120,30,.13)"
    );

    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle = glow;

    ctx.beginPath();
    ctx.arc(0, 0, s * 1.8, 0, Math.PI * 2);
    ctx.fill();


    /* body */

    const body =
        ctx.createLinearGradient(
            -s/2,
            -s*.65,
            s/2,
            s*.65
        );

    body.addColorStop(
        0,
        "#d85b19"
    );

    body.addColorStop(
        .5,
        "#ff8b2c"
    );

    body.addColorStop(
        1,
        "#b83f13"
    );

    ctx.fillStyle = body;

    ctx.beginPath();

    ctx.roundRect(
        -s * .42,
        -s * .57,
        s * .84,
        s * 1.08,
        s * .14
    );

    ctx.fill();


    /* vertical ribs */

    ctx.strokeStyle =
        "rgba(255,211,125,.32)";

    ctx.lineWidth = 1;

    for (let i = -2; i <= 2; i++) {

        ctx.beginPath();

        ctx.moveTo(
            i * s * .14,
            -s * .48
        );

        ctx.lineTo(
            i * s * .14,
            s * .42
        );

        ctx.stroke();
    }


    /* inner flame */

    const flame =
        ctx.createRadialGradient(
            0, 0,
            0,
            0, 0,
            s * .38
        );

    flame.addColorStop(
        0,
        "rgba(255,255,210,.95)"
    );

    flame.addColorStop(
        .5,
        "rgba(255,205,82,.65)"
    );

    flame.addColorStop(
        1,
        "rgba(255,145,40,0)"
    );

    ctx.fillStyle = flame;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        s * .38,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* top/bottom */

    ctx.fillStyle =
        "rgba(255,205,120,.65)";

    ctx.fillRect(
        -s*.45,
        -s*.62,
        s*.9,
        s*.07
    );

    ctx.fillRect(
        -s*.45,
        s*.45,
        s*.9,
        s*.07
    );


    /* little tassel */

    ctx.strokeStyle =
        "rgba(255,194,102,.65)";

    ctx.beginPath();

    ctx.moveTo(
        0,
        s*.52
    );

    ctx.lineTo(
        0,
        s*.82
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
        -s*.12,
        s*.82
    );

    ctx.lineTo(
        s*.12,
        s*.82
    );

    ctx.stroke();

    ctx.restore();
}


function updateLanterns(dt) {

    for (
        let i = lanterns.length - 1;
        i >= 0;
        i--
    ) {

        const l = lanterns[i];

        /* PURE VERTICAL MOVEMENT */

        l.y -= l.speed * dt;

        drawLantern(l);

        if (l.y < -80) {

            if (state === STATES.SKY) {

                /*
                    Không recycle ngay lập tức.
                    Chờ spawn queue tạo lantern tiếp theo.
                    Như vậy luồng đèn luôn rải rác.
                */

                lanterns.splice(i, 1);

            } else {

                lanterns.splice(i, 1);
            }
        }
    }

    if (
        state === STATES.WAIT_LANTERNS &&
        lanterns.length === 0
    ) {

        startMoonReady();
    }
}


/* =========================================================
   MOON DRAW
========================================================= */

function drawMoon() {

    if (moon.opacity <= 0) return;

    let r =
        moon.radius *
        (1 + moon.hoverAmount * .055);

    const glowR =
        r *
        (2.4 + moon.hoverAmount * .7);


    /* outer glow */

    const glow =
        ctx.createRadialGradient(
            moon.x,
            moon.y,
            r * .3,
            moon.x,
            moon.y,
            glowR
        );

    glow.addColorStop(
        0,
        `rgba(255,241,164,${moon.glow * .48})`
    );

    glow.addColorStop(
        .38,
        `rgba(255,224,96,${moon.glow * .18})`
    );

    glow.addColorStop(
        1,
        "rgba(255,220,100,0)"
    );

    ctx.fillStyle = glow;

    ctx.beginPath();
    ctx.arc(
        moon.x,
        moon.y,
        glowR,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* moon body */

    const gradient =
        ctx.createRadialGradient(
            moon.x - r*.35,
            moon.y - r*.38,
            r*.08,

            moon.x,
            moon.y,
            r
        );

    gradient.addColorStop(
        0,
        "#fffef3"
    );

    gradient.addColorStop(
        .58,
        "#fff4b4"
    );

    gradient.addColorStop(
        1,
        "#e9c968"
    );

    ctx.globalAlpha =
        moon.opacity;

    ctx.fillStyle = gradient;

    ctx.beginPath();

    ctx.arc(
        moon.x,
        moon.y,
        r,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* subtle craters */

    ctx.globalAlpha =
        moon.opacity * .12;

    ctx.fillStyle = "#9d8139";

    const craters = [
        [-.28,-.18,.12],
        [.22,-.30,.08],
        [.32,.12,.13],
        [-.18,.30,.07],
        [-.38,.22,.055]
    ];

    for (const c of craters) {

        ctx.beginPath();

        ctx.arc(
            moon.x + c[0] * r,
            moon.y + c[1] * r,
            c[2] * r,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;
}


/* =========================================================
   MOON HOVER
========================================================= */

let mouseX = 0;
let mouseY = 0;

canvas.addEventListener("mousemove", e => {

    mouseX = e.clientX;
    mouseY = e.clientY;

    if (
        moon.hoverLocked ||
        state === STATES.MOON_SHRINK ||
        state === STATES.CAMERA ||
        state === STATES.FIREWORKS ||
        state === STATES.LOVE_FOREVER
    ) {

        moon.hover = false;
        return;
    }

    if (
        state === STATES.MOON_APPEAR ||
        state === STATES.SKY ||
        state === STATES.MOON_READY
    ) {

        const dx =
            mouseX - moon.x;

        const dy =
            mouseY -
            (moon.y + cameraOffsetY);

        const distance =
            Math.hypot(dx, dy);

        moon.hover =
            distance <
            moon.radius * 1.35;
    }
});


/* Smooth hover amount */

function updateMoonHover(dt) {

    const target =
        moon.hover &&
        !moon.hoverLocked
            ? 1
            : 0;

    /*
        Slow enough to feel like light
        rather than a button animation.
    */

    moon.hoverAmount +=
        (target - moon.hoverAmount) *
        Math.min(1, dt * 5);
}
