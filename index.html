<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test 1</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh;
            overflow: hidden;
            background: #02050e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        /* BẦU TRỜI SAO NỀN CỐ ĐỊNH */
        .sky-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, #1b2735 0%, #02050e 100%);
            z-index: 1;
        }

        /* KHỐI TRÒN MẶT TRĂNG */
        #moon {
            position: absolute;
            top: 50%;
            left: 50%;
            /* Dùng scale để thu nhỏ mượt và chính xác thời gian */
            transform: translate(-50%, -50%) scale(1);
            z-index: 10;
            width: 360px;
            height: 360px;
            border-radius: 50%;
            cursor: pointer;
            
            /* Ánh sáng ban đầu */
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #fff3a0 50%, #fbc531 100%);
            box-shadow: 0 0 40px rgba(251, 197, 49, 0.4);
            filter: brightness(1);

            /* Transition 5 GIÂY CHUẨN XÁC CHO SCALE THU NHỎ */
            transition: filter 3s ease, 
                        box-shadow 3s ease, 
                        transform 5s linear, 
                        top 3.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* RÊ CHUỘT LẠI GẦN: SÁNG TỪ TỪ LÊN ĐÚNG 3S */
        #moon:hover {
            filter: brightness(1.5);
            box-shadow: 0 0 100px #fff, 0 0 140px #fbc531;
        }

        /* GIỮ NGUYÊN ĐỘ SÁNG RỰC RỠ KHI ĐÃ CLICK */
        #moon.is-clicked {
            filter: brightness(1.5) !important;
            box-shadow: 0 0 100px #fff, 0 0 140px #fbc531 !important;
            cursor: default;
        }

        /* THU NHỎ TRONG ĐÚNG 5 GIÂY (GIẢM KÍCH THƯỚC XUỐNG KHOẢNG 43% BAN ĐẦU) */
        #moon.shrink {
            transform: translate(-50%, -50%) scale(0.43) !important;
        }

        /* KHI BAY LÊN 1/3 TRÊN MÀN HÌNH */
        #moon.move-up {
            top: 25% !important;
        }

        /* CẢNH 1/3 DƯỚI MÀN HÌNH: CẬN CẢNH VAI TỰA VÀO NHAU */
        #bottom-scene {
            position: fixed;
            bottom: 0; left: 0;
            width: 100vw;
            height: 38vh;
            z-index: 5;
            opacity: 0;
            transition: opacity 2.5s ease;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        #bottom-scene.show {
            opacity: 1;
        }

        /* MẢNH ĐẤT NỀN DƯỚI */
        .ground-base {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(to top, #060a14 30%, rgba(6, 10, 20, 0.8) 75%, transparent 100%);
        }

        /* BÓNG 2 NGƯỜI ĐEN TUYỀN (KHÔNG PHÁT SÁNG) */
        .couple-silhouette {
            position: relative;
            z-index: 6;
            margin-bottom: -10px;
            /* Đã xóa hoàn toàn drop-shadow phát sáng */
        }

        /* HƯỚNG DẪN BẤM */
        #hint {
            position: fixed;
            bottom: 40px;
            color: #ffeaa7;
            font-size: 1.1rem;
            z-index: 20;
            pointer-events: none;
            opacity: 0.8;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

    <div class="sky-bg"></div>

    <!-- MẶT TRĂNG -->
    <div id="moon" onclick="startSequence()"></div>

    <!-- CẢNH BÓNG 2 NGƯỜI ĐEN TUYỀN KHÔNG PHÁT SÁNG -->
    <div id="bottom-scene">
        <div class="ground-base"></div>
        <svg class="couple-silhouette" width="340" height="220" viewBox="0 0 340 220">
            <!-- Đồi đất cong nhẹ -->
            <path d="M 0,220 Q 170,170 340,220 Z" fill="#090f1d"/>
            
            <!-- Người bên trái -->
            <circle cx="130" cy="85" r="28" fill="#090f1d"/>
            <path d="M 70,220 C 70,140 100,120 145,120 C 175,120 185,150 185,220 Z" fill="#090f1d"/>
            
            <!-- Người bên phải nghiêng đầu tựa sát vào vai người trái -->
            <circle cx="182" cy="98" r="24" fill="#090f1d"/>
            <path d="M 150,220 C 150,150 170,135 210,138 C 240,148 245,180 255,220 Z" fill="#090f1d"/>
        </svg>
    </div>

    <div id="hint">Rê chuột làm sáng 3s, click vào Mặt Trăng để bắt đầu</div>

    <script>
        const moon = document.getElementById('moon');
        const hint = document.getElementById('hint');
        const bottomScene = document.getElementById('bottom-scene');

        let isStarted = false;

        function startSequence() {
            if (isStarted) return;
            isStarted = true;

            // 1. Chốt độ sáng rực rỡ và ẩn chữ hướng dẫn
            moon.classList.add('is-clicked');
            hint.style.opacity = '0';

            // 2. Giữ nguyên độ sáng 3 giây rồi bắt đầu thu nhỏ đúng 5 giây
            setTimeout(() => {
                moon.classList.add('shrink');

                // 3. Đúng 5 giây thu nhỏ xong, dừng nghỉ 2 giây
                setTimeout(() => {
                    // 4. Từ từ bay lên 1/3 phía trên màn hình
                    moon.classList.add('move-up');

                    // 5. Đồng thời hiện hình bóng 2 người tựa vào nhau phía dưới
                    bottomScene.classList.add('show');
                }, 5000 + 2000); // 5s thu nhỏ + 2s tạm dừng

            }, 3000);
        }
    </script>
</body>
</html>
