<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mặt Trăng Thu Nhỏ Bán Kính Mượt Mà</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh;
            overflow: hidden;
            background: #02050e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        /* BẦU TRỜI SAO NỀN CỐ ĐỊNH */
        .sky-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, #1b2735 0%, #02050e 100%);
            z-index: 1;
        }

        /* KHỐI TRÒN MẶT TRĂNG DUY NHẤT */
        #moon {
            position: absolute;
            z-index: 10;
            width: 360px;
            height: 360px;
            border-radius: 50%;
            cursor: pointer;
            
            /* Ánh sáng ban đầu (sáng bình thường) */
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #fff3a0 50%, #fbc531 100%);
            box-shadow: 0 0 40px rgba(251, 197, 49, 0.4);
            filter: brightness(1);

            /* Hiệu ứng tăng độ sáng từ từ trong 3 giây khi rê chuột */
            transition: filter 3s ease, box-shadow 3s ease;
        }

        /* RÊ CHUỘT LẠI GẦN / NỔI LÊN MẶT TRĂNG: SÁNG TỪ TỪ LÊN TRONG 3S */
        #moon:hover {
            filter: brightness(1.5);
            box-shadow: 0 0 100px #fff, 0 0 140px #fbc531;
        }

        /* KHI ĐÃ CLICK: GIỮ NGUYÊN ĐỘ SÁNG RỰC RỠ VÀ KHÔNG NHẬN HOVER NỮA */
        #moon.is-clicked {
            filter: brightness(1.5) !important;
            box-shadow: 0 0 100px #fff, 0 0 140px #fbc531 !important;
            cursor: default;
        }

        /* HƯỚNG DẪN BẤM */
        #hint {
            position: fixed;
            bottom: 50px;
            color: #ffeaa7;
            font-size: 1.1rem;
            z-index: 20;
            pointer-events: none;
            opacity: 0.8;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

    <div class="sky-bg"></div>

    <!-- MẶT TRĂNG DUY NHẤT -->
    <div id="moon" onclick="onMoonClick()"></div>

    <div id="hint">Di chuột lại gần Mặt Trăng để phát sáng, bấm vào để thu nhỏ</div>

    <script>
        const moon = document.getElementById('moon');
        const hint = document.getElementById('hint');
        
        let currentSize = 360; // Đường kính ban đầu 360px
        let isShrinking = false;
        let shrinkSpeed = 0.8; // Giảm ~0.8px mỗi khung hình (rất nhỏ và mượt)

        function onMoonClick() {
            if (isShrinking) return;
            isShrinking = true;

            // Chốt cố định độ sáng rực rỡ
            moon.classList.add('is-clicked');
            hint.style.opacity = '0';

            // Bắt đầu vòng lặp giảm px tốc độ cao (60fps) giúp mượt tối đa
            requestAnimationFrame(shrinkMoon);
        }

        function shrinkMoon() {
            if (currentSize > 0) {
                currentSize -= shrinkSpeed; // Giảm kích thước từng chút một

                if (currentSize < 0) currentSize = 0;

                // Cập nhật kích thước mặt trăng, giữ nguyên vị trí căn giữa
                moon.style.width = currentSize + 'px';
                moon.style.height = currentSize + 'px';

                // Tiếp tục gọi khung hình tiếp theo
                requestAnimationFrame(shrinkMoon);
            } else {
                moon.style.display = 'none'; // Biến mất hoàn toàn khi bán kính về 0
            }
        }
    </script>
</body>
</html>
