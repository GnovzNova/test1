<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tặng Em Bé Mặt Trăng Nhỏ 🌕✨</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap');
    
    body {
      margin: 0;
      padding: 0;
      background-color: #020617;
      color: #f9fafb;
      font-family: 'Quicksand', sans-serif;
      overflow: hidden;
      user-select: none;
    }

    .font-handwriting {
      font-family: 'Dancing Script', cursive;
    }

    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .blinking-cursor::after {
      content: '|';
      animation: blink 0.8s infinite;
      color: #fef08a;
      margin-left: 3px;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .ui-layer {
      position: relative;
      z-index: 10;
    }
  </style>
</head>
<body class="w-screen h-screen relative flex items-center justify-center">

  <canvas id="mainCanvas"></canvas>

  <!-- INTRO SCREEN -->
  <div id="introScreen" class="ui-layer flex flex-col items-center justify-center p-6 text-center max-w-xl transition-opacity duration-1000">
    <div class="h-24 flex items-center justify-center">
      <p id="typewriterText" class="text-xl sm:text-2xl md:text-3xl font-medium tracking-wide text-amber-100/90 leading-relaxed min-h-[3rem]"></p>
    </div>
  </div>

  <!-- CARD MODAL -->
  <div id="cardModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-md opacity-0 pointer-events-none transition-all duration-500">
    <div id="cardContainer" class="glass-card rounded-2xl p-6 sm:p-8 max-w-lg w-full transform scale-95 transition-transform duration-500 relative border border-amber-200/20">
      <div class="text-center mb-4">
        <span class="text-4xl">🏮</span>
        <h3 class="text-amber-200/90 font-handwriting text-2xl mt-1">Lời Chúc Đêm Trung Thu</h3>
      </div>
      
      <div class="min-h-[130px] flex items-center justify-center my-4">
        <p id="cardText" class="text-lg text-slate-100 text-center font-normal leading-relaxed whitespace-pre-line"></p>
      </div>

      <div id="cardFooter" class="text-center mt-6 opacity-0 transition-opacity duration-700">
        <p class="text-xs text-amber-100/60 font-light tracking-wider">Chạm ra ngoài để khép lại.</p>
      </div>
    </div>
  </div>

  <!-- ENDING TEXT SCREEN -->
  <div id="endingScreen" class="ui-layer fixed inset-0 flex flex-col items-center justify-center p-6 text-center pointer-events-none z-40">
    <p id="endingText1" class="text-2xl sm:text-3xl md:text-4xl font-light tracking-widest text-amber-100/90 opacity-0 transition-opacity duration-1000 my-2 font-handwriting">
      Trung Thu Vui Vẻ Nhé
    </p>
    <p id="endingText2" class="text-base sm:text-lg text-rose-200/80 opacity-0 transition-opacity duration-1000 mt-4 tracking-wider">
      Em Bé Của Em ❤️
    </p>
  </div>

  <script>
    const LANTERN_LIMIT = 3;
    let lanternClicks = 0;
    let activeCardOpen = false;

    const GREETINGS = [
      "Gửi em bé,\nChúc em có một đêm Trung Thu thật ấm áp và tràn ngập niềm vui ✨\nDù bầu trời ngoài kia có rộng lớn thế nào, em vẫn luôn là điều đặc biệt nhất.",
      "Cảm ơn em đã xuất hiện và làm cho những ngày bình thường trở nên thật ngọt ngào 🌕\nMong cho nụ cười của em bé luôn rạng rỡ như ánh trăng đêm nay.",
      "Mặt trăng nhỏ này là dành riêng cho em đấy ❤️\nHy vọng chúng ta sẽ cùng nhau đi qua thật nhiều mùa Trung Thu trọn vẹn và hạnh phúc hơn nữa."
    ];

    const STATES = {
      INTRO_TYPING: 'INTRO_TYPING',
      DOT_BLINKING: 'DOT_BLINKING',
      MOON_AWAKENING: 'MOON_AWAKENING',
      INTERACTIVE_SKY: 'INTERACTIVE_SKY',
      WAITING_LANTERNS_CLEAR: 'WAITING_LANTERNS_CLEAR',
      MOON_GLOWING_UP: 'MOON_GLOWING_UP',
      MOON_SHRINKING: 'MOON_SHRINKING',
      CAMERA_PANNING: 'CAMERA_PANNING',
      FIREWORKS_SHOW: 'FIREWORKS_SHOW',
      FIREWORKS_PAUSE: 'FIREWORKS_PAUSE',
      LOVE_FOREVER_BURST: 'LOVE_FOREVER_BURST',
      ENDING_TEXT: 'ENDING_TEXT'
    };

    let currentState = STATES.INTRO_TYPING;

    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const typewriterTextEl = document.getElementById('typewriterText');
    const introScreenEl = document.getElementById('introScreen');
    const cardModal = document.getElementById('cardModal');
    const cardContainer = document.getElementById('cardContainer');
    const cardTextEl = document.getElementById('cardText');
    const cardFooter = document.getElementById('cardFooter');
    const endingText1 = document.getElementById('endingText1');
    const endingText2 = document.getElementById('endingText2');

    let width, height;
    let cameraOffsetY = 0;
    let targetCameraOffsetY = 0;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let stars = [];
    let lanterns = [];
    let fireworks = [];
    let particles = [];

    // Smooth hover LERP properties for Moon
    const moon = {
      x: 0,
      y: 0,
      radius: 0,
      targetRadius: 0,
      opacity: 0,
      glowOpacity: 0,
      hoverScale: 1.0,
      targetHoverScale: 1.0,
      hoverGlow: 0.0,
      targetHoverGlow: 0.0
    };

    const introLines = [
      "25-9-2026",
      "Rằm tháng 8 rồi đấy",
      "Thế em bé đã có quà gì chưa",
      "Tặng em bé một mặt trăng nhỏ nhé!"
    ];

    async function runIntroTypewriter() {
      // 1. CHO 3S KHI MỚI VÀO WEB RỒI MỚI HIỆN CHỮ
      await sleep(3000);

      typewriterTextEl.classList.add('blinking-cursor');
      
      for (let i = 0; i < introLines.length; i++) {
        const line = introLines[i];
        for (let j = 0; j <= line.length; j++) {
          typewriterTextEl.innerText = line.substring(0, j);
          await sleep(80 + Math.random() * 30);
        }

        await sleep(1500);

        if (i < introLines.length - 1) {
          for (let j = line.length; j >= 0; j--) {
            typewriterTextEl.innerText = line.substring(0, j);
            await sleep(35);
          }
          await sleep(400);
        }
      }

      await sleep(1200);
      typewriterTextEl.classList.remove('blinking-cursor');
      introScreenEl.style.opacity = '0';
      
      await sleep(1000);
      introScreenEl.style.display = 'none';

      startDotSequence();
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // --- ĐỐM SÁNG 2PX NHẤP NHÁY CHILL ---
    async function startDotSequence() {
      currentState = STATES.DOT_BLINKING;
      moon.x = width / 2;
      moon.y = height / 2;
      moon.radius = 2; // Đúng 2px
      moon.opacity = 0;

      // 6 giây nhấp nháy 3 nhịp cực êm
      const blinkDuration = 6000; 
      const startTime = performance.now();

      await new Promise(resolve => {
        function pulse(now) {
          const elapsed = now - startTime;
          if (elapsed < blinkDuration) {
            const progress = elapsed / blinkDuration;
            // Cosine cho nhịp thở mượt không bị khựng
            moon.opacity = (1 - Math.cos(progress * Math.PI * 6)) * 0.45;
            requestAnimationFrame(pulse);
          } else {
            moon.opacity = 0.9;
            resolve();
          }
        }
        requestAnimationFrame(pulse);
      });

      startMoonAwakening();
    }

    // --- MẶT TRĂNG PHÓNG TO CHẬM CHILL ---
    function startMoonAwakening() {
      currentState = STATES.MOON_AWAKENING;
      moon.opacity = 1;
      moon.targetRadius = Math.min(width, height) * 0.12;
      if (moon.targetRadius < 50) moon.targetRadius = 50;
      if (moon.targetRadius > 95) moon.targetRadius = 95;

      // Phóng to chậm trong 4.5 giây
      let startTime = null;
      function animateAwake(time) {
        if (!startTime) startTime = time;
        let progress = (time - startTime) / 4500;
        if (progress > 1) progress = 1;

        const ease = 1 - Math.pow(1 - progress, 3);
        moon.radius = 2 + (moon.targetRadius - 2) * ease;
        moon.glowOpacity = ease * 0.8;

        if (progress < 1) {
          requestAnimationFrame(animateAwake);
        }
      }
      requestAnimationFrame(animateAwake);
    }

    function initStars() {
      stars = [];
      const count = Math.floor((width * height) / 3200);
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height * 1.5,
          size: Math.random() * 1.4 + 0.4,
          alpha: Math.random() * 0.7 + 0.2,
          twinkleSpeed: Math.random() * 0.012 + 0.005
        });
      }
    }
    initStars();

    // --- ĐÈN LỒNG TO HƠN + BAY NHANH HƠN VỪA PHẢI ---
    function spawnLanterns() {
      lanterns = [];
      const maxLanternsOnScreen = 5;
      for (let i = 0; i < maxLanternsOnScreen; i++) {
        setTimeout(() => {
          if (currentState === STATES.INTERACTIVE_SKY || currentState === STATES.WAITING_LANTERNS_CLEAR) {
            lanterns.push(createLantern(true));
          }
        }, i * 1800 + Math.random() * 600);
      }
    }

    function createLantern(fromBottom = true) {
      // Tăng kích thước đèn lồng (Scale 0.95 - 1.35)
      const scale = Math.random() * 0.4 + 0.95;
      return {
        x: Math.random() * (width - 140) + 70,
        y: fromBottom ? height + 80 + Math.random() * 100 : Math.random() * height,
        speedY: Math.random() * 0.4 + 0.65, // Bay vừa tầm, không bị quá chậm
        swayAmplitude: Math.random() * 18 + 12,
        swaySpeed: Math.random() * 0.015 + 0.01,
        swayOffset: Math.random() * Math.PI * 2,
        scale: scale,
        opacity: Math.random() * 0.2 + 0.85,
        size: 34 * scale,
        flicker: Math.random() * Math.PI
      };
    }

    function drawBeautifulLantern(ctx, l, timestamp) {
      ctx.save();
      ctx.globalAlpha = l.opacity;
      ctx.translate(l.x, l.y);

      const s = l.scale;
      l.flicker += 0.05;
      const glowPulse = Math.sin(l.flicker) * 0.15 + 0.85;

      // 1. Soft Warm Glow
      const lGlow = ctx.createRadialGradient(0, 0, 3, 0, 0, 42 * s);
      lGlow.addColorStop(0, `rgba(251, 146, 60, ${0.8 * glowPulse})`);
      lGlow.addColorStop(0.6, `rgba(245, 158, 11, ${0.3 * glowPulse})`);
      lGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = lGlow;
      ctx.beginPath();
      ctx.arc(0, 0, 42 * s, 0, Math.PI * 2);
      ctx.fill();

      // 2. Tassel
      const swayTassel = Math.sin(timestamp * 0.0025 + l.swayOffset) * 6;
      ctx.strokeStyle = '#dc2626';
      ctx.lineWidth = 2 * s;
      ctx.beginPath();
      ctx.moveTo(0, 20 * s);
      ctx.quadraticCurveTo(swayTassel * 0.5, 32 * s, swayTassel, 44 * s);
      ctx.stroke();

      // 3. Main Body
      const bodyGrad = ctx.createLinearGradient(-15 * s, 0, 15 * s, 0);
      bodyGrad.addColorStop(0, '#ea580c');
      bodyGrad.addColorStop(0.5, '#f97316');
      bodyGrad.addColorStop(1, '#c2410c');

      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.roundRect(-14 * s, -19 * s, 28 * s, 38 * s, 8 * s);
      ctx.fill();

      // Caps
      ctx.fillStyle = '#78350f';
      ctx.fillRect(-11 * s, -21.5 * s, 22 * s, 3.5 * s);
      ctx.fillRect(-11 * s, 19 * s, 22 * s, 3.5 * s);

      // Inner Light
      ctx.fillStyle = `rgba(254, 240, 138, ${glowPulse})`;
      ctx.beginPath();
      ctx.ellipse(0, 0, 6 * s, 10 * s, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    async function openGreetingCard(index) {
      activeCardOpen = true;
      cardModal.classList.remove('pointer-events-none');
      cardModal.classList.remove('opacity-0');
      cardContainer.classList.remove('scale-95');
      cardContainer.classList.add('scale-100');
      cardFooter.classList.add('opacity-0');
      cardTextEl.innerText = '';
      cardTextEl.classList.add('blinking-cursor');

      const text = GREETINGS[index];
      await sleep(400);

      for (let i = 0; i <= text.length; i++) {
        if (!activeCardOpen) break;
        cardTextEl.innerText = text.substring(0, i);
        await sleep(35 + Math.random() * 20);
      }

      await sleep(500);
      cardTextEl.classList.remove('blinking-cursor');
      cardFooter.classList.remove('opacity-0');
    }

    function closeGreetingCard() {
      if (!activeCardOpen) return;
      activeCardOpen = false;
      cardModal.classList.add('opacity-0');
      cardModal.classList.add('pointer-events-none');
      cardContainer.classList.remove('scale-100');
      cardContainer.classList.add('scale-95');

      lanternClicks++;

      if (lanternClicks >= LANTERN_LIMIT) {
        currentState = STATES.WAITING_LANTERNS_CLEAR;
      }
    }

    cardModal.addEventListener('click', () => {
      closeGreetingCard();
    });

    // MƯỢT HÓA HOVER MẶT TRĂNG
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top - cameraOffsetY;

      if (currentState === STATES.MOON_AWAKENING || currentState === STATES.INTERACTIVE_SKY || currentState === STATES.MOON_GLOWING_UP) {
        const dist = Math.hypot(mouseX - moon.x, mouseY - moon.y);
        if (dist < moon.radius * 1.3) {
          moon.targetHoverScale = 1.15;
          moon.targetHoverGlow = 0.4;
        } else {
          moon.targetHoverScale = 1.0;
          moon.targetHoverGlow = 0.0;
        }
      }
    });

    canvas.addEventListener('click', (e) => {
      if (activeCardOpen) return;

      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top - cameraOffsetY;

      if (currentState === STATES.MOON_AWAKENING) {
        const dist = Math.hypot(mouseX - moon.x, mouseY - moon.y);
        if (dist < moon.radius * 1.4) {
          currentState = STATES.INTERACTIVE_SKY;
          spawnLanterns();
        }
      } 
      else if (currentState === STATES.INTERACTIVE_SKY) {
        for (let i = lanterns.length - 1; i >= 0; i--) {
          const l = lanterns[i];
          const dist = Math.hypot(mouseX - l.x, mouseY - l.y);
          if (dist < l.size * 1.5) {
            lanterns.splice(i, 1);
            openGreetingCard(lanternClicks);
            break;
          }
        }
      }
      else if (currentState === STATES.MOON_GLOWING_UP) {
        const dist = Math.hypot(mouseX - moon.x, mouseY - moon.y);
        if (dist < moon.radius * 1.4) {
          triggerOutroSequence();
        }
      }
    });

    async function triggerOutroSequence() {
      currentState = STATES.MOON_SHRINKING;

      // THU NHỎ MẶT TRĂNG CHẬM CHILL (3.5s)
      const startR = moon.radius;
      const targetR = 10;
      let startTime = null;

      await new Promise(resolve => {
        function shrink(time) {
          if (!startTime) startTime = time;
          let p = (time - startTime) / 3500;
          if (p > 1) p = 1;
          const ease = 1 - Math.pow(1 - p, 3);
          moon.radius = startR - (startR - targetR) * ease;
          if (p < 1) requestAnimationFrame(shrink);
          else resolve();
        }
        requestAnimationFrame(shrink);
      });

      await sleep(5000);

      currentState = STATES.CAMERA_PANNING;
      targetCameraOffsetY = -height * 0.32;
      
      let panStartTime = null;
      await new Promise(resolve => {
        function pan(time) {
          if (!panStartTime) panStartTime = time;
          let p = (time - panStartTime) / 4000;
          if (p > 1) p = 1;
          const ease = 0.5 - Math.cos(p * Math.PI) / 2;
          cameraOffsetY = targetCameraOffsetY * ease;
          if (p < 1) requestAnimationFrame(pan);
          else resolve();
        }
        requestAnimationFrame(pan);
      });

      await sleep(2000);

      currentState = STATES.FIREWORKS_SHOW;
      const fireworkInterval = setInterval(() => {
        if (currentState === STATES.FIREWORKS_SHOW) {
          launchRandomFirework();
        }
      }, 750);

      await sleep(10000);
      clearInterval(fireworkInterval);

      currentState = STATES.FIREWORKS_PAUSE;
      await sleep(3000);

      currentState = STATES.LOVE_FOREVER_BURST;
      launchLoveForeverBurst();

      await sleep(5000);

      currentState = STATES.ENDING_TEXT;
      endingText1.style.opacity = '1';
      await sleep(3200);
      endingText1.style.opacity = '0';
      await sleep(1500);
      endingText2.style.opacity = '1';
    }

    function launchRandomFirework() {
      const startX = width * 0.2 + Math.random() * width * 0.6;
      const targetY = height * 0.15 + Math.random() * height * 0.25 - cameraOffsetY;
      const colors = ['#fde047', '#f43f5e', '#38bdf8', '#a855f7', '#34d399', '#fb923c'];
      
      fireworks.push({
        x: startX,
        y: height - cameraOffsetY,
        targetY: targetY,
        speed: Math.random() * 2.5 + 6.5,
        color: colors[Math.floor(Math.random() * colors.length)],
        exploded: false
      });
    }

    function createExplosion(x, y, color) {
      const particleCount = 55;
      for (let i = 0; i < particleCount; i++) {
        const angle = (Math.PI * 2 / particleCount) * i + Math.random() * 0.2;
        const speed = Math.random() * 4.5 + 1.8;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color: color,
          alpha: 1,
          decay: Math.random() * 0.014 + 0.009,
          gravity: 0.07
        });
      }
    }

    function launchLoveForeverBurst() {
      for (let i = -3; i <= 3; i++) {
        fireworks.push({
          x: width / 2 + i * 40,
          y: height - cameraOffsetY,
          targetY: height * 0.22 - cameraOffsetY,
          speed: 8.5,
          color: '#fef08a',
          exploded: false,
          isTextRocket: i === 0
        });
      }
    }

    function createTextParticles(cx, cy) {
      const tCanvas = document.createElement('canvas');
      const tCtx = tCanvas.getContext('2d');
      tCanvas.width = 800;
      tCanvas.height = 200;
      
      tCtx.fillStyle = '#ffffff';
      tCtx.font = 'bold 68px "Quicksand", sans-serif';
      tCtx.textAlign = 'center';
      tCtx.textBaseline = 'middle';
      tCtx.fillText('LOVE FOREVER', 400, 100);

      const imgData = tCtx.getImageData(0, 0, 800, 200);
      const data = imgData.data;

      const step = 6;
      for (let y = 0; y < 200; y += step) {
        for (let x = 0; x < 800; x += step) {
          const index = (y * 800 + x) * 4;
          if (data[index + 3] > 128) {
            const px = cx + (x - 400) * (width < 640 ? 0.75 : 1.1);
            const py = cy + (y - 100) * (width < 640 ? 0.75 : 1.1);
            
            particles.push({
              x: cx,
              y: cy,
              targetX: px,
              targetY: py,
              vx: (px - cx) * 0.08 + (Math.random() - 0.5) * 2,
              vy: (py - cy) * 0.08 + (Math.random() - 0.5) * 2,
              color: '#fef08a',
              alpha: 1,
              decay: 0.0055,
              gravity: 0.012,
              isText: true
            });
          }
        }
      }
    }

    function render(timestamp) {
      ctx.clearRect(0, 0, width, height);

      // LERP HOVER SMOOTHNESS
      moon.hoverScale += (moon.targetHoverScale - moon.hoverScale) * 0.06;
      moon.hoverGlow += (moon.targetHoverGlow - moon.hoverGlow) * 0.06;

      ctx.save();
      ctx.translate(0, cameraOffsetY);

      // Stars
      for (let s of stars) {
        s.alpha += Math.sin(timestamp * s.twinkleSpeed) * 0.008;
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0.1, Math.min(1, s.alpha))})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      }

      // Moon
      if (moon.opacity > 0) {
        ctx.save();
        
        const currentR = moon.radius * moon.hoverScale;

        // Smooth Breathing Glow
        const breathGlow = Math.sin(timestamp * 0.0012) * 0.1 + 0.9;
        const glowRadius = currentR * (currentState === STATES.MOON_GLOWING_UP ? 3.8 : 2.4) * breathGlow;
        
        const glowGradient = ctx.createRadialGradient(moon.x, moon.y, currentR * 0.4, moon.x, moon.y, glowRadius);
        glowGradient.addColorStop(0, `rgba(254, 240, 138, ${(moon.glowOpacity + moon.hoverGlow) * 0.85})`);
        glowGradient.addColorStop(0.5, `rgba(253, 224, 71, ${(moon.glowOpacity + moon.hoverGlow) * 0.3})`);
        glowGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

        ctx.fillStyle = glowGradient;
        ctx.beginPath();
        ctx.arc(moon.x, moon.y, glowRadius, 0, Math.PI * 2);
        ctx.fill();

        // Moon Disk
        const moonGradient = ctx.createRadialGradient(
          moon.x - currentR * 0.28, 
          moon.y - currentR * 0.28, 
          currentR * 0.1, 
          moon.x, 
          moon.y, 
          currentR
        );
        moonGradient.addColorStop(0, '#ffffff');
        moonGradient.addColorStop(0.7, '#fef08a');
        moonGradient.addColorStop(1, '#fde047');

        ctx.fillStyle = moonGradient;
        ctx.globalAlpha = moon.opacity;
        ctx.beginPath();
        ctx.arc(moon.x, moon.y, currentR, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Lanterns
      if (currentState === STATES.INTERACTIVE_SKY || currentState === STATES.WAITING_LANTERNS_CLEAR) {
        for (let i = lanterns.length - 1; i >= 0; i--) {
          const l = lanterns[i];
          l.y -= l.speedY;
          l.x += Math.sin(timestamp * l.swaySpeed + l.swayOffset) * 0.4;

          drawBeautifulLantern(ctx, l, timestamp);

          if (l.y < -80) {
            if (currentState === STATES.INTERACTIVE_SKY) {
              lanterns[i] = createLantern(true);
            } else {
              lanterns.splice(i, 1);
            }
          }
        }

        if (currentState === STATES.WAITING_LANTERNS_CLEAR && lanterns.length === 0) {
          currentState = STATES.MOON_GLOWING_UP;
          moon.glowOpacity = 1;
        }
      }

      // Fireworks
      for (let i = fireworks.length - 1; i >= 0; i--) {
        const fw = fireworks[i];
        fw.y -= fw.speed;

        ctx.strokeStyle = fw.color;
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(fw.x, fw.y + 8);
        ctx.lineTo(fw.x, fw.y);
        ctx.stroke();

        if (fw.y <= fw.targetY) {
          if (fw.isTextRocket) {
            createTextParticles(fw.x, fw.y);
          } else {
            createExplosion(fw.x, fw.y, fw.color);
          }
          fireworks.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.alpha -= p.decay;

        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.isText ? 1.8 : 2.1, 0, Math.PI * 2);
        ctx.fill();

        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }

      // 5. BÓNG NGƯỜI TỰA VÀO NHAU (TỌA ĐỘ CHUẨN ĐÁY MÀN HÌNH)
      ctx.save();
      // Vẽ cố định ở phần đáy canvas bên dưới
      const groundY = height + Math.abs(targetCameraOffsetY) - 20;

      // Ngọn đồi
      ctx.fillStyle = '#020617';
      ctx.beginPath();
      ctx.ellipse(width / 2, groundY + 130, width * 0.75, 170, 0, Math.PI, 0);
      ctx.fill();

      // Silhouette hai đứa
      const centerX = width / 2;
      const silY = groundY - 15;

      ctx.fillStyle = '#080d1a';

      // Person 1 (Bên trái)
      ctx.beginPath();
      ctx.arc(centerX - 18, silY - 45, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(centerX - 16, silY - 18, 16, 24, 0.15, 0, Math.PI * 2);
      ctx.fill();

      // Person 2 (Bên phải tựa đầu vào)
      ctx.beginPath();
      ctx.arc(centerX + 6, silY - 40, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(centerX + 8, silY - 15, 14, 22, -0.12, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();

      ctx.restore();
      requestAnimationFrame(render);
    }

    window.onload = () => {
      runIntroTypewriter();
      requestAnimationFrame(render);
    };
  </script>
</body>
</html>
