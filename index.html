<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đêm Trăng Trung Thu Mượt Mà</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh;
            overflow: hidden;
            background: #02050e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        /* BẦU TRỜI SAO NỀN CỐ ĐỊNH */
        .sky-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, #1b2735 0%, #02050e 100%);
            z-index: 1;
        }

        /* KHỐI TRÒN MẶT TRĂNG */
        #moon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            width: 360px;
            height: 360px;
            border-radius: 50%;
            cursor: pointer;
            
            /* Ánh sáng ban đầu */
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #fff3a0 50%, #fbc531 100%);
            box-shadow: 0 0 40px rgba(251, 197, 49, 0.4);
            filter: brightness(1);

            /* Dùng CSS Transition giúp chuyển động thu nhỏ và di chuyển cực kỳ mượt */
            transition: filter 3s ease, 
                        box-shadow 3s ease, 
                        width 3.5s cubic-bezier(0.4, 0, 0.2, 1), 
                        height 3.5s cubic-bezier(0.4, 0, 0.2, 1), 
                        top 3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* RÊ CHUỘT LẠI GẦN: SÁNG TỪ TỪ LÊN ĐÚNG 3S */
        #moon:hover {
            filter: brightness(1.5);
            box-shadow: 0 0 100px #fff, 0 0 140px #fbc531;
        }

        /* GIỮ NGUYÊN ĐỘ SÁNG RỰC RỠ KHI ĐÃ CLICK */
        #moon.is-clicked {
            filter: brightness(1.5) !important;
            box-shadow: 0 0 100px #fff, 0 0 140px #fbc531 !important;
            cursor: default;
        }

        /* KHI THU NHỎ (NHỎ HƠN 1-2PX SO VỚI TRƯỚC) */
        #moon.shrink {
            width: 160px !important;
            height: 160px !important;
        }

        /* KHI BAY LÊN 1/3 TRÊN MÀN HÌNH */
        #moon.move-up {
            top: 25% !important;
        }

        /* CẢNH 1/3 DƯỚI MÀN HÌNH: 2 BÓNG NGƯỜI */
        #bottom-scene {
            position: fixed;
            bottom: 0; left: 0;
            width: 100vw;
            height: 35vh;
            z-index: 5;
            opacity: 0;
            transition: opacity 2.5s ease;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        #bottom-scene.show {
            opacity: 1;
        }

        /* MẢNH ĐẤT NỀN DƯỚI */
        .ground-base {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(to top, #080d1a 30%, rgba(8, 13, 26, 0.7) 70%, transparent 100%);
        }

        /* HÌNH BÓNG 2 NGƯỜI NỔI BẬT NỀN ĐÊM */
        .couple-silhouette {
            position: relative;
            z-index: 6;
            margin-bottom: 25px;
            filter: drop-shadow(0 0 10px rgba(255, 243, 160, 0.3));
        }

        /* HƯỚNG DẪN BẤM */
        #hint {
            position: fixed;
            bottom: 40px;
            color: #ffeaa7;
            font-size: 1.1rem;
            z-index: 20;
            pointer-events: none;
            opacity: 0.8;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

    <div class="sky-bg"></div>

    <!-- MẶT TRĂNG -->
    <div id="moon" onclick="startSequence()"></div>

    <!-- CẢNH DƯỚI MÀN HÌNH (HÌNH BÓNG 2 NGƯỜI RÕ RÀNG) -->
    <div id="bottom-scene">
        <div class="ground-base"></div>
        <svg class="couple-silhouette" width="200" height="140" viewBox="0 0 200 140">
            <!-- Mảnh đất đồi nhỏ -->
            <path d="M 0,140 Q 100,100 200,140 Z" fill="#0d1424"/>
            
            <!-- Người bên trái (nam/nữ) -->
            <circle cx="85" cy="45" r="15" fill="#152035"/>
            <path d="M 60,140 C 60,85 75,70 95,70 C 100,70 105,85 105,140 Z" fill="#152035"/>
            
            <!-- Người bên phải nghiêng đầu tựa vào vai -->
            <circle cx="112" cy="52" r="13" fill="#152035"/>
            <path d="M 95,140 C 95,90 105,80 128,82 C 138,92 132,110 138,140 Z" fill="#152035"/>
        </svg>
    </div>

    <div id="hint">Di chuột để làm sáng 3s, click vào Mặt Trăng để thu nhỏ</div>

    <script>
        const moon = document.getElementById('moon');
        const hint = document.getElementById('hint');
        const bottomScene = document.getElementById('bottom-scene');

        let isStarted = false;

        function startSequence() {
            if (isStarted) return;
            isStarted = true;

            // 1. Chốt độ sáng rực rỡ và ẩn chữ hướng dẫn
            moon.classList.add('is-clicked');
            hint.style.opacity = '0';

            // 2. Đợi đúng 3s phát sáng rực rỡ rồi thu nhỏ cực mượt
            setTimeout(() => {
                moon.classList.add('shrink');

                // 3. Sau khi thu nhỏ xong (3.5s), dừng nghỉ đúng 2s
                setTimeout(() => {
                    // 4. Bay lên 1/3 phía trên
                    moon.classList.add('move-up');

                    // 5. Hiện hình bóng 2 người tựa vào nhau phía dưới
                    bottomScene.classList.add('show');
                }, 2000);

            }, 3000);
        }
    </script>
</body>
</html>
