<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thu Nhỏ Bán Kính Mặt Trăng</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh;
            overflow: hidden;
            background: #02050e;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: sans-serif;
        }

        /* KHỐI TRÒN MẶT TRĂNG BAN ĐẦU */
        #moon-circle {
            /* Khởi tạo đường kính 450px (bán kính 225px) */
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fff3a0 0%, #fbc531 60%, #e1b12c 100%);
            box-shadow: 0 0 50px rgba(251, 197, 49, 0.6);
            overflow: hidden;
            position: relative;

            /* Hiệu ứng giảm kích thước (width/height) mượt mà trong 1 giây */
            transition: width 1s linear, height 1s linear, opacity 1s linear;
        }

        /* CÁC PHẦN TỬ BÊN TRONG KHỐI TRÒN (TỰ ĐỘNG THU THEO BÁN KÍNH MẶT TRĂNG) */
        .ground {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 25%;
            background: #2c3e50;
        }

        .hang-nga {
            position: absolute;
            top: 20%; right: 20%;
            width: 15%; height: 20%;
            background: #fd79a8;
            border-radius: 20px;
            display: flex; justify-content: center; align-items: center;
            color: #fff; font-size: 0.8rem; font-weight: bold;
        }

        .tree {
            position: absolute;
            bottom: 15%; right: 10%;
            width: 18%; height: 35%;
            background: #2d1500;
            border-radius: 10px;
        }

        /* NÚT ĐIỀU KHIỂN */
        #btn {
            margin-top: 40px;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            color: #02050e;
            background: #fff3a0;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 243, 160, 0.6);
        }
    </style>
</head>
<body>

    <!-- KHỐI TRÒN MẶT TRĂNG -->
    <div id="moon-circle">
        <div class="hang-nga">Hằng Nga</div>
        <div class="tree"></div>
        <div class="ground"></div>
    </div>

    <button id="btn" onclick="startShrinking()">Bắt đầu thu nhỏ bán kính (10px / giây)</button>

    <script>
        let size = 450; // Kích thước ban đầu (đường kính = 450px, bán kính = 225px)
        let timer = null;

        function startShrinking() {
            document.getElementById('btn').style.display = 'none';

            // Cứ mỗi 1 giây (1000ms), giảm đường kính đi 20px (tương đương bán kính giảm 10px)
            timer = setInterval(() => {
                const moon = document.getElementById('moon-circle');
                
                size -= 20; // Bán kính giảm 10px mỗi giây

                if (size <= 50) {
                    // Khi bán kính còn quá nhỏ, làm mờ rồi dừng lại hẳn
                    moon.style.width = '0px';
                    moon.style.height = '0px';
                    moon.style.opacity = '0';
                    clearInterval(timer);
                } else {
                    moon.style.width = size + 'px';
                    moon.style.height = size + 'px';
                }
            }, 1000);
        }
    </script>
</body>
</html>
