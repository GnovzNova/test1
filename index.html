<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Zoom Out Mượt Mà</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh;
            overflow: hidden;
            background: #02050e;
            font-family: sans-serif;
        }

        /* BẦU TRỜI SAO NỀN CỐ ĐỊNH */
        .sky-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, #1b2735 0%, #02050e 100%);
            z-index: 1;
        }

        /* MẶT TRĂNG OUTRO (NẰM PHÍA SAU) */
        #outro-moon {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.6);
            width: 300px; height: 300px;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #fff3a0 50%, #fbc531 100%);
            border-radius: 50%;
            box-shadow: 0 0 80px #fbc531;
            z-index: 2;
            opacity: 0;
            transition: opacity 2s ease, transform 3s ease;
        }
        #outro-moon.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* TOÀN BỘ CẢNH MẶT TRĂNG (SẼ ZOOM OUT) */
        #moon-scene {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 10;
            /* Thiết lập tâm zoom đúng ở giữa màn hình */
            transform-origin: center center;
            /* Hiệu ứng chuyển động kéo xa và mờ đi mượt mà trong 3.5 giây */
            transition: transform 3.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 3.5s ease;
        }

        /* LỚP PHỦ ZOOM OUT: BỊ LÔI RA XA VÀ MỜ DẦN */
        #moon-scene.zoom-out {
            transform: scale(0.1);
            opacity: 0;
            pointer-events: none;
        }

        /* CÁC PHẦN TỬ TRONG CẢNH */
        .ground {
            position: absolute;
            bottom: 0; left: 0;
            width: 100vw; height: 160px;
            background: #2c3e50;
            border-radius: 50% 50% 0 0 / 20px 20px 0 0;
        }

        .hang-nga {
            position: absolute;
            top: 20%; right: 20%;
            width: 80px; height: 120px;
            background: #fd79a8;
            border-radius: 40px;
            display: flex; justify-content: center; align-items: center;
            color: #fff; font-weight: bold;
            box-shadow: 0 0 20px #fd79a8;
        }

        .banyan-tree {
            position: absolute;
            bottom: 80px; right: 5%;
            width: 120px; height: 200px;
            background: #2d1500;
            border-radius: 20px 20px 0 0;
        }

        /* NÚT THỬ NGHIỆM */
        #test-btn {
            position: fixed;
            bottom: 30px; left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #02050e;
            background: #fff3a0;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 243, 160, 0.8);
        }
    </style>
</head>
<body>

    <div class="sky-bg"></div>

    <!-- CẢNH MẶT TRĂNG BAN ĐẦU -->
    <div id="moon-scene">
        <div class="hang-nga">Hằng Nga</div>
        <div class="banyan-tree"></div>
        <div class="ground"></div>
    </div>

    <!-- MẶT TRĂNG LÚC OUTRO -->
    <div id="outro-moon"></div>

    <button id="test-btn" onclick="runZoomOut()">Thử Zoom Out (Kéo Xa)</button>

    <script>
        function runZoomOut() {
            const moonScene = document.getElementById('moon-scene');
            const outroMoon = document.getElementById('outro-moon');
            const btn = document.getElementById('test-btn');

            btn.style.display = 'none';

            // Kích hoạt thu nhỏ (scale) và mờ dần (opacity)
            moonScene.classList.add('zoom-out');

            // Sau khi cảnh cũ thu nhỏ biến mất hẳn thì hiện vầng trăng Rằm
            setTimeout(() => {
                outroMoon.classList.add('show');
            }, 1800);
        }
    </script>
</body>
</html>
