<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tặng Em Bé Mặt Trăng Nhỏ 🌕✨</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap');
    
    body {
      margin: 0;
      padding: 0;
      background-color: #030712;
      color: #f9fafb;
      font-family: 'Quicksand', sans-serif;
      overflow: hidden;
      user-select: none;
    }

    .font-handwriting {
      font-family: 'Dancing Script', cursive;
    }

    /* Custom scrollbar & glassmorphism */
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .blinking-cursor::after {
      content: '|';
      animation: blink 0.8s infinite;
      color: #fef08a;
      margin-left: 2px;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Smooth Canvas overlay */
    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .ui-layer {
      position: relative;
      z-index: 10;
    }
  
    #sceneFade {
      position: fixed;
      inset: 0;
      z-index: 35;
      pointer-events: none;
      background: #000;
      opacity: 0;
      transition: opacity 1.8s ease-in-out;
    }

    #finalTypingScreen {
      opacity: 0;
      transition: opacity 1.8s ease;
    }

    .final-typing-wrap {
      width: min(880px, 88vw);
      text-align: left;
    }

    .final-typing-text {
      margin: 0;
      text-align: left;
      color: rgba(255, 248, 220, .94);
      font-size: clamp(17px, 2.2vw, 27px);
      line-height: 2;
      letter-spacing: .045em;
      font-weight: 500;
      white-space: pre-wrap;
      text-shadow: 0 0 18px rgba(255, 238, 170, .08);
    }
  </style>
</head>
<body class="w-screen h-screen relative flex items-center justify-center">

  <!-- Background Canvas for Moon, Stars, Lanterns, Fireworks -->
  <!-- Glow: intentionally subtle but visible; tuned to avoid bloom/judder. -->
  <canvas id="mainCanvas"></canvas>

  <!-- INTRO SCREEN -->
  <div id="introScreen" class="ui-layer flex flex-col items-center justify-center p-6 text-center max-w-xl transition-opacity duration-1000">
    <div class="h-24 flex items-center justify-center">
      <p id="typewriterText" class="text-xl sm:text-2xl md:text-3xl font-medium tracking-wide text-amber-100/90 leading-relaxed min-h-[3rem]"></p>
    </div>
  </div>

  <!-- CARD MODAL FOR LANTERNS -->
  <div id="cardModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-md opacity-0 pointer-events-none transition-all duration-500">
    <div id="cardContainer" class="glass-card rounded-2xl p-6 sm:p-8 max-w-lg w-full transform scale-95 transition-transform duration-500 relative border border-amber-200/20">
      <div class="text-center mb-4">
        <span class="text-3xl">🏮</span>
        <h3 class="text-amber-200/80 font-handwriting text-xl mt-1">Lời Chúc Đêm Trung Thu</h3>
      </div>
      
      <div class="min-h-[120px] flex items-center justify-center my-4">
        <p id="cardText" class="text-lg text-slate-100 text-center font-normal leading-relaxed whitespace-pre-line"></p>
      </div>

      <div id="cardFooter" class="text-center mt-6 opacity-0 transition-opacity duration-700">
        <p class="text-xs text-slate-400 font-light tracking-wider">Chạm ra ngoài để khép lại.</p>
      </div>
    </div>
  </div>

  <div id="sceneFade" aria-hidden="true"></div>

  <!-- FINAL TYPEWRITER SCREEN -->
  <div id="finalTypingScreen" class="ui-layer fixed inset-0 flex items-center justify-center p-6 pointer-events-none z-40">
    <div class="final-typing-wrap">
      <p id="finalTypingText" class="final-typing-text"></p>
    </div>
  </div>

  <!-- ENDING TEXT SCREEN -->
  <div id="endingScreen" class="ui-layer fixed inset-0 flex flex-col items-center justify-center p-6 text-center pointer-events-none z-40">
    <p id="endingText1" class="text-2xl sm:text-3xl md:text-4xl font-light tracking-widest text-amber-100/90 opacity-0 transition-opacity duration-1000 my-2 font-handwriting">
      Trung Thu Vui Vẻ Nhé
    </p>
    <p id="endingText2" class="text-base sm:text-lg text-rose-200/80 opacity-0 transition-opacity duration-1000 mt-4 tracking-wider">
      Em Bé Của Em ❤️
    </p>
  </div>

  <script>
    // Global Constants & Config
    const LANTERN_LIMIT = 3;
    let lanternClicks = 0;
    let activeCardOpen = false;
    let cardCanClose = false;

    const GREETINGS = [
      "Gửi em bé,\nChúc em có một đêm Trung Thu thật ấm áp và tràn ngập niềm vui ✨\nDù bầu trời ngoài kia có rộng lớn thế nào, em vẫn luôn là điều đặc biệt nhất.",
      "Cảm ơn em đã xuất hiện và làm cho những ngày bình thường trở nên thật ngọt ngào 🌕\nMong cho nụ cười của em bé luôn rạng rỡ như ánh trăng đêm nay.",
      "Mặt trăng nhỏ này là dành riêng cho em đấy ❤️\nHy vọng chúng ta sẽ cùng nhau đi qua thật nhiều mùa Trung Thu trọn vẹn và hạnh phúc hơn nữa."
    ];

    // State Machine States
    const STATES = {
      INTRO_TYPING: 'INTRO_TYPING',
      DOT_BLINKING: 'DOT_BLINKING',
      MOON_AWAKENING: 'MOON_AWAKENING',
      INTERACTIVE_SKY: 'INTERACTIVE_SKY',
      WAITING_LANTERNS_CLEAR: 'WAITING_LANTERNS_CLEAR',
      MOON_GLOWING_UP: 'MOON_GLOWING_UP',
      MOON_SHRINKING: 'MOON_SHRINKING',
      CAMERA_PANNING: 'CAMERA_PANNING',
      FIREWORKS_SHOW: 'FIREWORKS_SHOW',
      FIREWORKS_DRAINING: 'FIREWORKS_DRAINING',
      ENDING_TEXT: 'ENDING_TEXT'
    };

    let currentState = STATES.INTRO_TYPING;

    // DOM Elements
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const typewriterTextEl = document.getElementById('typewriterText');
    const introScreenEl = document.getElementById('introScreen');
    const cardModal = document.getElementById('cardModal');
    const cardContainer = document.getElementById('cardContainer');
    const cardTextEl = document.getElementById('cardText');
    const cardFooter = document.getElementById('cardFooter');
    const endingText1 = document.getElementById('endingText1');
    const endingText2 = document.getElementById('endingText2');
    const finalTypingScreen = document.getElementById('finalTypingScreen');
    const finalTypingText = document.getElementById('finalTypingText');
    const sceneFade = document.getElementById('sceneFade');

    // Canvas Dimensions & Camera Offset
    let width, height;
    let cameraOffsetY = 0;
    let targetCameraOffsetY = 0;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // World Elements Data Structures
    let stars = [];
    let lanterns = [];
    let fireworks = [];
    let particles = [];
    let textParticles = [];

    // Moon Properties
    const moon = {
      x: 0,
      y: 0,
      radius: 0,
      targetRadius: 0,
      opacity: 0,
      glowOpacity: 0,
      isAwake: false,
      isHovered: false
    };

    // --- INTRO TYPEWRITER LOGIC ---
    const introLines = [
      "25-9-2026",
      "Rằm tháng 8 rồi đấy",
      "Thế em bé đã có quà gì chưa",
      "Tặng em bé một mặt trăng nhỏ nhé!"
    ];

    async function runIntroTypewriter() {
      typewriterTextEl.classList.add('blinking-cursor');
      
      for (let i = 0; i < introLines.length; i++) {
        const line = introLines[i];
        
        // Type line
        for (let j = 0; j <= line.length; j++) {
          typewriterTextEl.innerText = line.substring(0, j);
          await sleep(70 + Math.random() * 40);
        }

        // Blink cursor x4
        await sleep(1500);

        // Backspace if not the last line
        if (i < introLines.length - 1) {
          for (let j = line.length; j >= 0; j--) {
            typewriterTextEl.innerText = line.substring(0, j);
            await sleep(35);
          }
          await sleep(300);
        }
      }

      // Last line completed: hold cursor blink x4, then fade out intro text
      await sleep(1200);
      typewriterTextEl.classList.remove('blinking-cursor');
      introScreenEl.style.opacity = '0';
      
      await sleep(1000);
      introScreenEl.style.display = 'none';

      // Transition to Dot Blinking
      startDotSequence();
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // --- MOON INITIALIZATION & AWAKENING ---
    function startDotSequence() {
      currentState = STATES.DOT_BLINKING;
      moon.x = width / 2;
      moon.y = height / 2;
      moon.radius = 1.5;
      moon.opacity = 0;

      let blinkCount = 0;
      const blinkInterval = setInterval(() => {
        moon.opacity = moon.opacity === 0 ? 0.9 : 0;
        blinkCount++;
        if (blinkCount >= 6) { // 3 blinks
          clearInterval(blinkInterval);
          startMoonAwakening();
        }
      }, 400);
    }

    function startMoonAwakening() {
      currentState = STATES.MOON_AWAKENING;
      moon.opacity = 1;
      moon.targetRadius = Math.min(width, height) * 0.12;
      if (moon.targetRadius < 45) moon.targetRadius = 45;
      if (moon.targetRadius > 90) moon.targetRadius = 90;

      // Expand Moon
      let startTime = null;
      function animateAwake(time) {
        if (!startTime) startTime = time;
        let progress = (time - startTime) / 2500;
        if (progress > 1) progress = 1;

        // Smooth ease-out expansion
        const ease = 1 - Math.pow(1 - progress, 3);
        moon.radius = 1.5 + (moon.targetRadius - 1.5) * ease;
        moon.glowOpacity = ease * 0.24;

        if (progress < 1) {
          requestAnimationFrame(animateAwake);
        } else {
          moon.isAwake = true;
        }
      }
      requestAnimationFrame(animateAwake);
    }

    // --- STARS & LANTERNS GENERATION ---
    function initStars() {
      stars = [];
      const count = Math.floor((width * height) / 3000);
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height * 1.5, // Cover extended canvas
          size: Math.random() * 1.5 + 0.5,
          alpha: Math.random() * 0.8 + 0.2,
          twinkleSpeed: Math.random() * 0.02 + 0.005
        });
      }
    }
    initStars();

    function spawnLanterns() {
      lanterns = [];
      const totalLanterns = 14;
      for (let i = 0; i < totalLanterns; i++) {
        setTimeout(() => {
          if (currentState === STATES.INTERACTIVE_SKY || currentState === STATES.WAITING_LANTERNS_CLEAR) {
            lanterns.push(createLantern());
          }
        }, i * 600 + Math.random() * 300); // Staggered spawn delay
      }
    }

    function createLantern() {
      const scale = Math.random() * 0.4 + 0.6;
      return {
        x: Math.random() * (width - 60) + 30,
        y: height + Math.random() * 100 + 40,
        speedY: Math.random() * 0.6 + 0.4,
        swayAmplitude: Math.random() * 20 + 10,
        swaySpeed: Math.random() * 0.02 + 0.01,
        swayOffset: Math.random() * Math.PI * 2,
        scale: scale,
        opacity: Math.random() * 0.3 + 0.7,
        size: 24 * scale
      };
    }

    // --- CARD TYPING & INTERACTION ---
    async function openGreetingCard(index) {
      activeCardOpen = true;
      cardCanClose = false;
      cardModal.classList.remove('pointer-events-none');
      cardModal.classList.remove('opacity-0');
      cardContainer.classList.remove('scale-95');
      cardContainer.classList.add('scale-100');
      cardFooter.classList.add('opacity-0');
      cardTextEl.innerText = '';
      cardTextEl.classList.add('blinking-cursor');

      const text = GREETINGS[index];
      await sleep(500);

      for (let i = 0; i < text.length; i++) {
        if (!activeCardOpen) return;
        cardTextEl.innerText = text.substring(0, i + 1);
        let delay = 72 + Math.random() * 42;
        if (/[,.!?\n]/.test(text[i])) delay += 100;
        await sleep(delay);
      }

      // Typing must finish completely, then wait 1s before the card becomes closable.
      await sleep(1000);
      if (!activeCardOpen) return;
      cardTextEl.classList.remove('blinking-cursor');
      cardFooter.classList.remove('opacity-0');
      cardCanClose = true;
    }

    function closeGreetingCard() {
      if (!activeCardOpen || !cardCanClose) return;
      activeCardOpen = false;
      cardCanClose = false;
      cardModal.classList.add('opacity-0');
      cardModal.classList.add('pointer-events-none');
      cardContainer.classList.remove('scale-100');
      cardContainer.classList.add('scale-95');

      lanternClicks++;
      if (lanternClicks >= LANTERN_LIMIT) {
        currentState = STATES.WAITING_LANTERNS_CLEAR;
      }
    }

    cardModal.addEventListener('click', (e) => {
      if (e.target === cardModal && cardCanClose) closeGreetingCard();
    });

    // --- EVENT LISTENERS (MOUSE/TOUCH) ---
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top - cameraOffsetY;

      if (currentState === STATES.MOON_AWAKENING || currentState === STATES.INTERACTIVE_SKY || currentState === STATES.MOON_GLOWING_UP) {
        const dist = Math.hypot(mouseX - moon.x, mouseY - moon.y);
        moon.isHovered = dist < moon.radius * 1.3;
      }
    });

    canvas.addEventListener('click', (e) => {
      if (activeCardOpen) return;

      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top - cameraOffsetY;

      // Click Moon in AWAKENING state -> Enter INTERACTIVE_SKY
      if (currentState === STATES.MOON_AWAKENING) {
        const dist = Math.hypot(mouseX - moon.x, mouseY - moon.y);
        if (dist < moon.radius * 1.5) {
          currentState = STATES.INTERACTIVE_SKY;
          spawnLanterns();
        }
      } 
      // Click Lanterns
      else if (currentState === STATES.INTERACTIVE_SKY) {
        for (let i = lanterns.length - 1; i >= 0; i--) {
          const l = lanterns[i];
          const dist = Math.hypot(mouseX - l.x, mouseY - l.y);
          if (dist < l.size * 1.5) {
            // Remove clicked lantern and trigger card
            lanterns.splice(i, 1);
            openGreetingCard(lanternClicks);
            break;
          }
        }
      }
      // Click Moon when ready for Outro (State MOON_GLOWING_UP)
      else if (currentState === STATES.MOON_GLOWING_UP) {
        const dist = Math.hypot(mouseX - moon.x, mouseY - moon.y);
        if (dist < moon.radius * 1.5) {
          triggerOutroSequence();
        }
      }
    });

    // --- OUTRO SEQUENCE TRANSITIONS ---
    async function triggerOutroSequence() {
      currentState = STATES.MOON_SHRINKING;

      const startR = moon.radius;
      const targetR = 8;
      let startTime = null;

      await new Promise(resolve => {
        function shrink(time) {
          if (!startTime) startTime = time;
          let p = (time - startTime) / 2200;
          if (p > 1) p = 1;
          const ease = 0.5 - Math.cos(p * Math.PI) / 2;
          moon.radius = startR - (startR - targetR) * ease;
          if (p < 1) requestAnimationFrame(shrink);
          else resolve();
        }
        requestAnimationFrame(shrink);
      });

      await sleep(5000);

      // Original camera/silhouette transition.
      currentState = STATES.CAMERA_PANNING;
      targetCameraOffsetY = -height * 0.28;
      let panStartTime = null;
      await new Promise(resolve => {
        function pan(time) {
          if (!panStartTime) panStartTime = time;
          let p = (time - panStartTime) / 3500;
          if (p > 1) p = 1;
          const ease = 0.5 - Math.cos(p * Math.PI) / 2;
          cameraOffsetY = targetCameraOffsetY * ease;
          if (p < 1) requestAnimationFrame(pan);
          else resolve();
        }
        requestAnimationFrame(pan);
      });

      await sleep(2000);

      // 20 volleys in 20 seconds; each volley launches 10–15 shells.
      currentState = STATES.FIREWORKS_SHOW;
      fireworks.length = 0;
      particles.length = 0;

      let volleyIndex = 0;
      const launchVolley = () => {
        if (currentState !== STATES.FIREWORKS_SHOW) return;
        launchFireworkVolley(volleyIndex++);
      };

      launchVolley();
      const fireworkInterval = setInterval(launchVolley, 1000);
      await sleep(20000);
      clearInterval(fireworkInterval);

      // Do not clear particles here. Let every last rocket/spark finish.
      currentState = STATES.FIREWORKS_DRAINING;
      await waitForFireworksToFinish();

      // Only after the last particle is gone does the entire scene fade.
      sceneFade.style.opacity = '1';
      await sleep(1800);

      currentState = STATES.ENDING_TEXT;
      await fadeText(endingText1, 3000, true);
      await sleep(700);
      await fadeText(endingText1, 1600, false);
      await sleep(700);
      await fadeText(endingText2, 3000, true);
      await sleep(700);
      await fadeText(endingText2, 1600, false);
      await sleep(900);

      // Reveal final typing after the visual ending cards are complete.
      sceneFade.style.opacity = '0';
      await sleep(900);
      await runFinalTyping();
    }

    function fadeText(el, duration, inwards) {
      return new Promise(resolve => {
        el.style.transition = `opacity ${duration}ms ease-in-out`;
        el.style.opacity = inwards ? '0' : '1';
        requestAnimationFrame(() => requestAnimationFrame(() => {
          el.style.opacity = inwards ? '1' : '0';
        }));
        setTimeout(resolve, duration);
      });
    }

    function countActiveFireworkParticles() {
      let count = fireworks.length + particles.length;
      return count;
    }

    async function waitForFireworksToFinish() {
      const deadline = performance.now() + 15000;
      while (countActiveFireworkParticles() > 0 && performance.now() < deadline) {
        await sleep(50);
      }
      fireworks.length = 0;
      particles.length = 0;
    }

    async function runFinalTyping() {
      finalTypingScreen.style.opacity = '1';
      finalTypingText.textContent = '';
      finalTypingText.classList.add('blinking-cursor');

      const typeSlow = async (text, base = 125) => {
        const before = finalTypingText.textContent;
        for (let i = 0; i < text.length; i++) {
          finalTypingText.textContent = before + text.slice(0, i + 1);
          let delay = base + Math.random() * 60;
          if (/[,.!?\n]/.test(text[i])) delay += 180;
          await sleep(delay);
        }
      };

      await typeSlow('Hà Nội, ngày 25 tháng 9 năm 2026', 125);
      await sleep(1000);
      await typeSlow('\nChúc em bé trung thu thật vui vẻ', 130);
      await sleep(800);
      await typeSlow('\nFrom:', 145);
      await sleep(2000);
      await typeSlow(' Mot nguoi yeu', 145);

      // Final frame stays here forever.
      finalTypingText.classList.remove('blinking-cursor');
    }

    // --- FIREWORKS & PARTICLE PHYSICS ---
    function launchFireworkVolley(volleyIndex = 0) {
      const count = 10 + Math.floor(Math.random() * 6); // 10–15 rockets.
      const colors = ['#fde047', '#f43f5e', '#38bdf8', '#a855f7', '#34d399', '#fb923c'];

      // Equal opportunity across left / center / right zones, with small randomness.
      for (let i = 0; i < count; i++) {
        const zone = i % 3;
        let startX;
        let targetRatio;

        if (zone === 0) {
          startX = width * (0.07 + Math.random() * 0.24);
          targetRatio = 0.16 + Math.random() * 0.25;
        } else if (zone === 1) {
          startX = width * (0.36 + Math.random() * 0.28);
          targetRatio = 0.11 + Math.random() * 0.30;
        } else {
          startX = width * (0.69 + Math.random() * 0.24);
          targetRatio = 0.16 + Math.random() * 0.25;
        }

        fireworks.push({
          x: startX,
          y: height - cameraOffsetY,
          targetY: height * targetRatio - cameraOffsetY,
          speed: Math.random() * 3 + 7.5,
          color: colors[(i + volleyIndex) % colors.length],
          exploded: false
        });
      }
    }

    function launchRandomFirework() {
      launchFireworkVolley(0);
    }

    function createExplosion(x, y, color) {
      const particleCount = 60;
      for (let i = 0; i < particleCount; i++) {
        const angle = (Math.PI * 2 / particleCount) * i + Math.random() * 0.2;
        const speed = Math.random() * 5 + 2;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color: color,
          alpha: 1,
          decay: Math.random() * 0.015 + 0.01,
          gravity: 0.08
        });
      }
    }


    // --- MAIN RENDER LOOP ---
    function render(timestamp) {
      ctx.clearRect(0, 0, width, height);

      // Save context for camera pan
      ctx.save();
      ctx.translate(0, cameraOffsetY);

      // 1. Draw Stars
      for (let s of stars) {
        s.alpha += Math.sin(timestamp * s.twinkleSpeed) * 0.01;
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0.1, Math.min(1, s.alpha))})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      }

      // 2. Draw Moon
      if (moon.opacity > 0) {
        ctx.save();
        
        // Hover dynamics
        const currentR = moon.isHovered ? moon.radius * 1.08 : moon.radius;

        // Moon Glow
        const glowRadius = currentR * (currentState === STATES.MOON_GLOWING_UP ? 3.0 : 2.25);
        const glowGradient = ctx.createRadialGradient(moon.x, moon.y, currentR * 0.5, moon.x, moon.y, glowRadius);
        glowGradient.addColorStop(0, `rgba(254, 240, 138, ${Math.min(0.22, moon.glowOpacity)})`);
        glowGradient.addColorStop(0.5, `rgba(253, 224, 71, ${Math.min(0.22, moon.glowOpacity) * 0.28})`);
        glowGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

        ctx.fillStyle = glowGradient;
        ctx.beginPath();
        ctx.arc(moon.x, moon.y, glowRadius, 0, Math.PI * 2);
        ctx.fill();

        // Moon Solid
        const moonGradient = ctx.createRadialGradient(
          moon.x - currentR * 0.3, 
          moon.y - currentR * 0.3, 
          currentR * 0.1, 
          moon.x, 
          moon.y, 
          currentR
        );
        moonGradient.addColorStop(0, '#ffffff');
        moonGradient.addColorStop(0.75, '#fef08a');
        moonGradient.addColorStop(1, '#fde047');

        ctx.fillStyle = moonGradient;
        ctx.globalAlpha = moon.opacity;
        ctx.beginPath();
        ctx.arc(moon.x, moon.y, currentR, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 3. Draw Lanterns
      if (currentState === STATES.INTERACTIVE_SKY || currentState === STATES.WAITING_LANTERNS_CLEAR) {
        for (let i = lanterns.length - 1; i >= 0; i--) {
          const l = lanterns[i];
          l.y -= l.speedY;
          l.x += Math.sin(timestamp * l.swaySpeed + l.swayOffset) * 0.5;

          // Render Lantern
          ctx.save();
          ctx.globalAlpha = l.opacity;
          ctx.translate(l.x, l.y);

          // Lantern Glow
          const lGlow = ctx.createRadialGradient(0, 0, 2, 0, 0, l.size * 1.8);
          lGlow.addColorStop(0, 'rgba(251, 146, 60, 0.8)');
          lGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
          ctx.fillStyle = lGlow;
          ctx.beginPath();
          ctx.arc(0, 0, l.size * 1.8, 0, Math.PI * 2);
          ctx.fill();

          // Lantern Body
          ctx.fillStyle = '#f97316';
          ctx.beginPath();
          ctx.roundRect(-l.size * 0.5, -l.size * 0.65, l.size, l.size * 1.3, 6);
          ctx.fill();

          // Inner Light
          ctx.fillStyle = '#fef08a';
          ctx.beginPath();
          ctx.arc(0, 0, l.size * 0.3, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();

          // Recycle/Remove offscreen lanterns
          if (l.y < -50) {
            if (currentState === STATES.INTERACTIVE_SKY) {
              lanterns[i] = createLantern();
            } else {
              lanterns.splice(i, 1);
            }
          }
        }

        // Check if all lanterns cleared in WAITING state
        if (currentState === STATES.WAITING_LANTERNS_CLEAR && lanterns.length === 0) {
          currentState = STATES.MOON_GLOWING_UP;
          const glowStart = performance.now();
          const glowFrom = Math.max(0.08, moon.glowOpacity || 0.08);
          (function animateFinalGlow(now) {
            const p = Math.min(1, (now - glowStart) / 3000);
            const e = 0.5 - Math.cos(p * Math.PI) / 2;
            moon.glowOpacity = glowFrom + (0.24 - glowFrom) * e;
            if (p < 1 && currentState === STATES.MOON_GLOWING_UP) {
              requestAnimationFrame(animateFinalGlow);
            }
          })(performance.now());
        }
      }

      // 4. Draw Fireworks & Particles
      for (let i = fireworks.length - 1; i >= 0; i--) {
        const fw = fireworks[i];
        fw.y -= fw.speed;

        ctx.strokeStyle = fw.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(fw.x, fw.y + 10);
        ctx.lineTo(fw.x, fw.y);
        ctx.stroke();

        if (fw.y <= fw.targetY) {
          createExplosion(fw.x, fw.y, fw.color);
          fireworks.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.alpha -= p.decay;

        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.0, 0, Math.PI * 2);
        ctx.fill();

        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }

      // 5. Draw Silhouettes (Revealed after camera pan)
      if (cameraOffsetY < 0) {
        ctx.save();
        const baseGroundY = height + Math.abs(targetCameraOffsetY) - 10;

        // Hill slope
        ctx.fillStyle = '#020617';
        ctx.beginPath();
        ctx.ellipse(width / 2, baseGroundY + 120, width * 0.7, 160, 0, Math.PI, 0);
        ctx.fill();

        // Two Silhouettes Sitting Together
        const centerX = width / 2;
        const groundY = baseGroundY - 20;

        ctx.fillStyle = '#090d16';

        // Person 1 (Left - Head & Torso leaning right)
        ctx.beginPath();
        ctx.arc(centerX - 16, groundY - 42, 10, 0, Math.PI * 2); // Head
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(centerX - 14, groundY - 18, 14, 22, 0.15, 0, Math.PI * 2); // Body
        ctx.fill();

        // Person 2 (Right - Head leaning on Person 1 shoulder)
        ctx.beginPath();
        ctx.arc(centerX + 6, groundY - 38, 9, 0, Math.PI * 2); // Head
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(centerX + 8, groundY - 16, 13, 20, -0.1, 0, Math.PI * 2); // Body
        ctx.fill();

        ctx.restore();
      }

      ctx.restore();
      requestAnimationFrame(render);
    }

    // Start App Sequence
    window.onload = () => {
      runIntroTypewriter();
      requestAnimationFrame(render);
    };
  </script>
</body>
</html>
