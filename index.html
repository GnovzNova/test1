<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đêm Trăng & Pháo Hoa I Love You</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh;
            overflow: hidden;
            background: #02050e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        /* BẦU TRỜI SAO NỀN CỐ ĐỊNH */
        .sky-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, #1b2735 0%, #02050e 100%);
            z-index: 1;
        }

        /* CANVAS VẼ PHÁO HOA */
        #fireworks-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 8;
            pointer-events: none;
        }

        /* KHỐI TRÒN MẶT TRĂNG */
        #moon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            z-index: 10;
            width: 360px;
            height: 360px;
            border-radius: 50%;
            cursor: pointer;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #fff3a0 50%, #fbc531 100%);
            box-shadow: 0 0 40px rgba(251, 197, 49, 0.4);
            filter: brightness(1);
            transition: filter 3s ease, 
                        box-shadow 3s ease, 
                        transform 5s cubic-bezier(0.4, 0, 0.2, 1), 
                        top 3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        #moon:hover {
            filter: brightness(1.5);
            box-shadow: 0 0 100px #fff, 0 0 140px #fbc531;
        }

        #moon.is-clicked {
            filter: brightness(1.5) !important;
            box-shadow: 0 0 100px #fff, 0 0 140px #fbc531 !important;
            cursor: default;
        }

        #moon.shrink {
            transform: translate(-50%, -50%) scale(0.43) !important;
        }

        #moon.move-up {
            top: 22% !important;
        }

        /* CẢNH BÓNG 2 NGƯỜI */
        #bottom-scene {
            position: fixed;
            bottom: 0; left: 0;
            width: 100vw;
            height: 38vh;
            z-index: 5;
            opacity: 0;
            transition: opacity 2.5s ease;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        #bottom-scene.show { opacity: 1; }

        .ground-base {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(to top, #060a14 30%, rgba(6, 10, 20, 0.8) 75%, transparent 100%);
        }

        .couple-silhouette {
            position: relative;
            z-index: 6;
            margin-bottom: -10px;
        }

        #hint {
            position: fixed;
            bottom: 40px;
            color: #ffeaa7;
            font-size: 1.1rem;
            z-index: 20;
            pointer-events: none;
            opacity: 0.8;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

    <div class="sky-bg"></div>
    <canvas id="fireworks-canvas"></canvas>

    <div id="moon" onclick="startSequence()"></div>

    <div id="bottom-scene">
        <div class="ground-base"></div>
        <svg class="couple-silhouette" width="340" height="220" viewBox="0 0 340 220">
            <path d="M 0,220 Q 170,170 340,220 Z" fill="#090f1d"/>
            <circle cx="130" cy="85" r="28" fill="#090f1d"/>
            <path d="M 70,220 C 70,140 100,120 145,120 C 175,120 185,150 185,220 Z" fill="#090f1d"/>
            <circle cx="182" cy="98" r="24" fill="#090f1d"/>
            <path d="M 150,220 C 150,150 170,135 210,138 C 240,148 245,180 255,220 Z" fill="#090f1d"/>
        </svg>
    </div>

    <div id="hint">Rê chuột làm sáng 3s, click vào Mặt Trăng để bắt đầu</div>

    <script>
        const moon = document.getElementById('moon');
        const hint = document.getElementById('hint');
        const bottomScene = document.getElementById('bottom-scene');
        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let isStarted = false;

        // KỊCH BẢN TỔNG THỂ
        function startSequence() {
            if (isStarted) return;
            isStarted = true;

            moon.classList.add('is-clicked');
            hint.style.opacity = '0';

            // 1. Giữ độ sáng 3s -> Bắt đầu thu nhỏ đúng 5s
            setTimeout(() => {
                moon.classList.add('shrink');

                // 2. Thu nhỏ xong 5s -> Tạm dừng 2s
                setTimeout(() => {
                    // 3. Trăng bay lên & hiện bóng 2 người (tốn ~3s transition)
                    moon.classList.add('move-up');
                    bottomScene.classList.add('show');

                    // 4. Sau khi trăng yên vị (đợi 3s) + nghỉ đúng 1s = 4000ms
                    setTimeout(() => {
                        startFireworksPhase1();
                    }, 4000);

                }, 5000 + 2000);

            }, 3000);
        }

        // HE THONG PHAO HOA CANVAS
        let particles = [];
        let rockets = [];

        function animate() {
            requestAnimationFrame(animate);
            ctx.fillStyle = 'rgba(2, 5, 14, 0.2)'; // Tạo vệt mờ đuôi pháo
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Update & Draw Rockets
            for (let i = rockets.length - 1; i >= 0; i--) {
                rockets[i].update();
                rockets[i].draw();
                if (rockets[i].exploded) {
                    rockets.splice(i, 1);
                }
            }

            // Update & Draw Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }
        animate();

        class Rocket {
            constructor(startX, startY, targetX, targetY, isTextRocket = false) {
                this.x = startX;
                this.y = startY;
                this.targetX = targetX;
                this.targetY = targetY;
                this.speed = 12;
                this.angle = Math.atan2(targetY - startY, targetX - startX);
                this.vx = Math.cos(this.angle) * this.speed;
                this.vy = Math.sin(this.angle) * this.speed;
                this.exploded = false;
                this.isTextRocket = isTextRocket;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Khi chạm đích thì nổ
                if (Math.hypot(this.targetX - this.x, this.targetY - this.y) < 15) {
                    this.exploded = true;
                    if (this.isTextRocket) {
                        explodeText();
                    } else {
                        explodeNormal(this.x, this.y);
                    }
                }
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = '#ffeaa7';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#fff';
                ctx.fill();
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color, vx, vy, friction = 0.95, gravity = 0.15) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = vx;
                this.vy = vy;
                this.alpha = 1;
                this.friction = friction;
                this.gravity = gravity;
            }

            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.012;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 6;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        function explodeNormal(x, y) {
            const colors = ['#ff7675', '#fd79a8', '#ffeaa7', '#74b9ff', '#55efc4', '#a29bfe'];
            const count = 50 + Math.floor(Math.random() * 30);
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 8 + 2;
                const color = colors[Math.floor(Math.random() * colors.length)];
                particles.push(new Particle(x, y, color, Math.cos(angle) * speed, Math.sin(angle) * speed));
            }
        }

        // PHASE 1: Vòng lặp 3-6 quả, lặp 10 lần
        let phase1Count = 0;
        function startFireworksPhase1() {
            if (phase1Count >= 10) {
                // Xong phase 1 -> Ngưng 1s rồi sang Phase 2
                setTimeout(() => {
                    startFireworksPhase2();
                }, 1000);
                return;
            }

            const waveRockets = 3 + Math.floor(Math.random() * 4); // 3 đến 6 quả
            for (let i = 0; i < waveRockets; i++) {
                setTimeout(() => {
                    const startX = canvas.width * (0.15 + Math.random() * 0.7);
                    const targetX = startX + (Math.random() * 100 - 50);
                    const targetY = canvas.height * (0.2 + Math.random() * 0.3);
                    rockets.push(new Rocket(startX, canvas.height, targetX, targetY));
                }, i * 200);
            }

            phase1Count++;
            setTimeout(startFireworksPhase1, 1500); // Khoảng cách giữa các đợt
        }

        // PHASE 2: Bắn 20 quả cùng lúc -> nổ chữ I LOVE YOU
        function startFireworksPhase2() {
            // Bắn 20 quả đồng loạt
            for (let i = 0; i < 20; i++) {
                const startX = canvas.width * (0.05 + (i / 20) * 0.9);
                const targetX = startX;
                const targetY = canvas.height * (0.2 + Math.random() * 0.25);
                
                // Quả ở giữa (thứ 10) sẽ là quả kích hoạt nổ ra chữ
                const isCenter = (i === 10);
                rockets.push(new Rocket(startX, canvas.height, targetX, targetY, isCenter));
            }
        }

        // NỔ TẠO CHỮ "I LOVE YOU"
        function explodeText() {
            // Sau 1s quả tên lửa chạm đích thì nổ bung chữ
            setTimeout(() => {
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                tempCanvas.width = 800;
                tempCanvas.height = 200;

                tempCtx.font = 'bold 90px "Segoe UI", Arial, sans-serif';
                tempCtx.fillStyle = '#ffffff';
                tempCtx.textAlign = 'center';
                tempCtx.textBaseline = 'middle';
                tempCtx.fillText('I LOVE YOU', 400, 100);

                const imgData = tempCtx.getImageData(0, 0, 800, 200);
                const centerX = canvas.width / 2;
                const centerY = canvas.height * 0.45;

                for (let y = 0; y < 200; y += 4) {
                    for (let x = 0; x < 800; x += 4) {
                        const index = (y * 800 + x) * 4;
                        if (imgData.data[index + 3] > 128) {
                            const px = centerX + (x - 400);
                            const py = centerY + (y - 100);
                            
                            // Tạo hiệu ứng nổ bung từ tâm ra đúng khung chữ
                            const angle = Math.random() * Math.PI * 2;
                            const speed = Math.random() * 2;
                            const colors = ['#ff7675', '#fd79a8', '#ffeaa7', '#fff'];
                            const color = colors[Math.floor(Math.random() * colors.length)];
                            
                            particles.push(new Particle(
                                px, py, color, 
                                Math.cos(angle) * speed, 
                                Math.sin(angle) * speed, 
                                0.92, 0.02 // Ma sát nhẹ, trọng lực nhỏ để chữ đọng lại lâu
                            ));
                        }
                    }
                }
            }, 1000);
        }
    </script>
</body>
</html>
