<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tặng Em Bé Mặt Trăng Nhỏ 🌕✨</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap');
    
    body {
      margin: 0;
      padding: 0;
      background-color: #030712;
      color: #f9fafb;
      font-family: 'Quicksand', sans-serif;
      overflow: hidden;
      user-select: none;
    }

    .font-handwriting {
      font-family: 'Dancing Script', cursive;
    }

    /* Custom scrollbar & glassmorphism */
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .blinking-cursor::after {
      content: '|';
      animation: blink 0.8s infinite;
      color: #fef08a;
      margin-left: 2px;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Smooth Canvas overlay */
    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .ui-layer {
      position: relative;
      z-index: 10;
    }
  </style>
</head>
<body class="w-screen h-screen relative flex items-center justify-center">

  <!-- Background Canvas for Moon, Stars, Lanterns, Fireworks -->
  <canvas id="mainCanvas"></canvas>

  <!-- INTRO SCREEN -->
  <div id="introScreen" class="ui-layer flex flex-col items-center justify-center p-6 text-center max-w-xl transition-opacity duration-1000">
    <div class="h-24 flex items-center justify-center">
      <p id="typewriterText" class="text-xl sm:text-2xl md:text-3xl font-medium tracking-wide text-amber-100/90 leading-relaxed min-h-[3rem]"></p>
    </div>
  </div>

  <!-- CARD MODAL FOR LANTERNS -->
  <div id="cardModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-md opacity-0 pointer-events-none transition-all duration-500">
    <div id="cardContainer" class="glass-card rounded-2xl p-6 sm:p-8 max-w-lg w-full transform scale-95 transition-transform duration-500 relative border border-amber-200/20">
      <div class="text-center mb-4">
        <span class="text-3xl">🏮</span>
        <h3 class="text-amber-200/80 font-handwriting text-xl mt-1">Lời Chúc Đêm Trung Thu</h3>
      </div>
      
      <div class="min-h-[120px] flex items-center justify-center my-4">
        <p id="cardText" class="text-lg text-slate-100 text-center font-normal leading-relaxed whitespace-pre-line"></p>
      </div>

      <div id="cardFooter" class="text-center mt-6 opacity-0 transition-opacity duration-700">
        <p class="text-xs text-slate-400 font-light tracking-wider">Chạm ra ngoài để khép lại.</p>
      </div>
    </div>
  </div>

  <!-- ENDING TEXT SCREEN -->
  <div id="endingScreen" class="ui-layer fixed inset-0 flex flex-col items-center justify-center p-6 text-center pointer-events-none z-40">
    <p id="endingText1" class="text-2xl sm:text-3xl md:text-4xl font-light tracking-widest text-amber-100/90 opacity-0 transition-opacity duration-1000 my-2 font-handwriting">
      Trung Thu Vui Vẻ Nhé
    </p>
    <p id="endingText2" class="text-base sm:text-lg text-rose-200/80 opacity-0 transition-opacity duration-1000 mt-4 tracking-wider">
      Em Bé Của Em ❤️
    </p>
  </div>

  <script>
    // Global Constants & Config
    const LANTERN_LIMIT = 3;
    let lanternClicks = 0;
    let activeCardOpen = false;

    const GREETINGS = [
      "Gửi em bé,\nChúc em có một đêm Trung Thu thật ấm áp và tràn ngập niềm vui ✨\nDù bầu trời ngoài kia có rộng lớn thế nào, em vẫn luôn là điều đặc biệt nhất.",
      "Cảm ơn em đã xuất hiện và làm cho những ngày bình thường trở nên thật ngọt ngào 🌕\nMong cho nụ cười của em bé luôn rạng rỡ như ánh trăng đêm nay.",
      "Mặt trăng nhỏ này là dành riêng cho em đấy ❤️\nHy vọng chúng ta sẽ cùng nhau đi qua thật nhiều mùa Trung Thu trọn vẹn và hạnh phúc hơn nữa."
    ];

    // State Machine States
    const STATES = {
      INTRO_TYPING: 'INTRO_TYPING',
      DOT_BLINKING: 'DOT_BLINKING',
      MOON_AWAKENING: 'MOON_AWAKENING',
      INTERACTIVE_SKY: 'INTERACTIVE_SKY',
      WAITING_LANTERNS_CLEAR: 'WAITING_LANTERNS_CLEAR',
      MOON_GLOWING_UP: 'MOON_GLOWING_UP',
      MOON_SHRINKING: 'MOON_SHRINKING',
      CAMERA_PANNING: 'CAMERA_PANNING',
      FIREWORKS_SHOW: 'FIREWORKS_SHOW',
      FIREWORKS_PAUSE: 'FIREWORKS_PAUSE',
      LOVE_FOREVER_BURST: 'LOVE_FOREVER_BURST',
      ENDING_TEXT: 'ENDING_TEXT'
    };

    let currentState = STATES.INTRO_TYPING;

    // DOM Elements
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const typewriterTextEl = document.getElementById('typewriterText');
    const introScreenEl = document.getElementById('introScreen');
    const cardModal = document.getElementById('cardModal');
    const cardContainer = document.getElementById('cardContainer');
    const cardTextEl = document.getElementById('cardText');
    const cardFooter = document.getElementById('cardFooter');
    const endingText1 = document.getElementById('endingText1');
    const endingText2 = document.getElementById('endingText2');

    // Canvas Dimensions & Camera Offset
    let width, height;
    let cameraOffsetY = 0;
    let targetCameraOffsetY = 0;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // World Elements Data Structures
    let stars = [];
    let lanterns = [];
    let fireworks = [];
    let particles = [];
    let textParticles = [];

    // Moon Properties
    const moon = {
      x: 0,
      y: 0,
      radius: 0,
      targetRadius: 0,
      opacity: 0,
      glowOpacity: 0,
      isAwake: false,
      isHovered: false,
      hoverLocked: false,
      hoverAmount: 0
    };

    // --- INTRO TYPEWRITER LOGIC ---
    const introLines = [
      "25-9-2026",
      "Rằm tháng 8 rồi đấy",
      "Thế em bé đã có quà gì chưa",
      "Tặng em bé một mặt trăng nhỏ nhé!"
    ];

    async function runIntroTypewriter() {
      typewriterTextEl.classList.add('blinking-cursor');
      
      for (let i = 0; i < introLines.length; i++) {
        const line = introLines[i];
        
        // Type line
        for (let j = 0; j <= line.length; j++) {
          typewriterTextEl.innerText = line.substring(0, j);
          await sleep(70 + Math.random() * 40);
        }

        // Blink cursor x4
        await sleep(1500);

        // Backspace if not the last line
        if (i < introLines.length - 1) {
          for (let j = line.length; j >= 0; j--) {
            typewriterTextEl.innerText = line.substring(0, j);
            await sleep(35);
          }
          await sleep(300);
        }
      }

      // Last line completed: hold cursor blink x4, then fade out intro text
      await sleep(1200);
      typewriterTextEl.classList.remove('blinking-cursor');
      introScreenEl.style.opacity = '0';
      
      await sleep(1000);
      introScreenEl.style.display = 'none';

      // Transition to Dot Blinking
      startDotSequence();
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // --- MOON INITIALIZATION & AWAKENING ---
    function startDotSequence() {
      currentState = STATES.DOT_BLINKING;
      moon.x = width / 2;
      moon.y = height / 2;
      moon.radius = 1.5;
      moon.opacity = 0;
      moon.hoverLocked = false;
      moon.isHovered = false;
      moon.hoverAmount = 0;

      let blinkCount = 0;
      const blinkInterval = setInterval(() => {
        moon.opacity = moon.opacity === 0 ? 0.9 : 0;
        blinkCount++;
        if (blinkCount >= 6) { // 3 blinks
          clearInterval(blinkInterval);
          startMoonAwakening();
        }
      }, 400);
    }

    function startMoonAwakening() {
      currentState = STATES.MOON_AWAKENING;
      moon.opacity = 1;
      moon.targetRadius = Math.min(width, height) * 0.12;
      if (moon.targetRadius < 45) moon.targetRadius = 45;
      if (moon.targetRadius > 90) moon.targetRadius = 90;

      // Expand Moon
      let startTime = null;
      function animateAwake(time) {
        if (!startTime) startTime = time;
        let progress = (time - startTime) / 5200;
        if (progress > 1) progress = 1;

        // Slow cinematic expansion: gentle at the beginning and end.
        const ease = 0.5 - Math.cos(progress * Math.PI) / 2;
        moon.radius = 1.5 + (moon.targetRadius - 1.5) * ease;
        moon.glowOpacity = ease * 0.8;

        if (progress < 1) {
          requestAnimationFrame(animateAwake);
        } else {
          moon.isAwake = true;
        }
      }
      requestAnimationFrame(animateAwake);
    }

    // --- STARS & LANTERNS GENERATION ---
    function initStars() {
      stars = [];
      const count = Math.floor((width * height) / 3000);
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height * 1.5, // Cover extended canvas
          size: Math.random() * 1.5 + 0.5,
          alpha: Math.random() * 0.8 + 0.2,
          twinkleSpeed: Math.random() * 0.02 + 0.005
        });
      }
    }
    initStars();

    function spawnLanterns() {
      lanterns = [];
      const totalLanterns = 18;

      // Staggered chain: many lanterns, but each appears at a controlled
      // interval and at a different lane so the stream feels continuous.
      for (let i = 0; i < totalLanterns; i++) {
        setTimeout(() => {
          if (currentState === STATES.INTERACTIVE_SKY || currentState === STATES.WAITING_LANTERNS_CLEAR) {
            lanterns.push(createLantern(i));
          }
        }, i * 760 + Math.random() * 180);
      }
    }

    function createLantern(index = 0) {
      const scale = Math.random() * 0.30 + 0.70;
      const laneCount = Math.max(7, Math.floor(width / 130));
      const lane = index % laneCount;
      const laneWidth = width / laneCount;

      return {
        // Fixed horizontal lane. No sine-wave sway.
        x: lane * laneWidth + laneWidth * 0.5 + (Math.random() - 0.5) * Math.min(18, laneWidth * 0.12),
        y: height + 50 + Math.floor(index / laneCount) * 115 + Math.random() * 45,
        speedY: Math.random() * 0.30 + 0.65,
        scale: scale,
        opacity: Math.random() * 0.22 + 0.68,
        size: 25 * scale,
        hitRadius: 25 * scale,
        index: index
      };
    }

    // --- CARD TYPING & INTERACTION ---
    async function openGreetingCard(index) {
      activeCardOpen = true;
      cardModal.classList.remove('pointer-events-none');
      cardModal.classList.remove('opacity-0');
      cardContainer.classList.remove('scale-95');
      cardContainer.classList.add('scale-100');
      cardFooter.classList.add('opacity-0');
      cardTextEl.innerText = '';
      cardTextEl.classList.add('blinking-cursor');

      const text = GREETINGS[index];
      await sleep(400);

      for (let i = 0; i <= text.length; i++) {
        if (!activeCardOpen) break;
        cardTextEl.innerText = text.substring(0, i);
        await sleep(35 + Math.random() * 20);
      }

      await sleep(600);
      cardTextEl.classList.remove('blinking-cursor');
      cardFooter.classList.remove('opacity-0');
    }

    function closeGreetingCard() {
      if (!activeCardOpen) return;
      activeCardOpen = false;
      cardModal.classList.add('opacity-0');
      cardModal.classList.add('pointer-events-none');
      cardContainer.classList.remove('scale-100');
      cardContainer.classList.add('scale-95');

      // Increment click state cleanly
      lanternClicks++;

      // If clicked 3 lanterns, progress state after card closes
      if (lanternClicks >= LANTERN_LIMIT) {
        currentState = STATES.WAITING_LANTERNS_CLEAR;
      }
    }

    cardModal.addEventListener('click', (e) => {
      // Close card on clicking anywhere
      closeGreetingCard();
    });

    // --- EVENT LISTENERS (MOUSE/TOUCH) ---
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top - cameraOffsetY;

      if (!moon.hoverLocked && (currentState === STATES.MOON_AWAKENING || currentState === STATES.INTERACTIVE_SKY || currentState === STATES.MOON_GLOWING_UP)) {
        const dist = Math.hypot(mouseX - moon.x, mouseY - moon.y);
        moon.isHovered = dist < moon.radius * 1.3;
      } else if (moon.hoverLocked) {
        moon.isHovered = false;
      }
    });

    canvas.addEventListener('click', (e) => {
      if (activeCardOpen) return;

      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top - cameraOffsetY;

      // Click Moon in AWAKENING state -> Enter INTERACTIVE_SKY
      if (currentState === STATES.MOON_AWAKENING) {
        const dist = Math.hypot(mouseX - moon.x, mouseY - moon.y);
        if (dist < moon.radius * 1.5) {
          moon.hoverLocked = true;
          moon.isHovered = false;
          currentState = STATES.INTERACTIVE_SKY;
          spawnLanterns();
        }
      } 
      // Click Lanterns
      else if (currentState === STATES.INTERACTIVE_SKY) {
        for (let i = lanterns.length - 1; i >= 0; i--) {
          const l = lanterns[i];
          const dist = Math.hypot(mouseX - l.x, mouseY - l.y);
          if (dist < l.size * 1.5) {
            // Remove clicked lantern and trigger card
            lanterns.splice(i, 1);
            openGreetingCard(lanternClicks);
            break;
          }
        }
      }
      // Click Moon when ready for Outro (State MOON_GLOWING_UP)
      else if (currentState === STATES.MOON_GLOWING_UP) {
        const dist = Math.hypot(mouseX - moon.x, mouseY - moon.y);
        if (dist < moon.radius * 1.5) {
          moon.hoverLocked = true;
          moon.isHovered = false;
          triggerOutroSequence();
        }
      }
    });

    // --- OUTRO SEQUENCE TRANSITIONS ---
    async function triggerOutroSequence() {
      currentState = STATES.MOON_SHRINKING;

      // Fast-settle shrink animation
      const startR = moon.radius;
      const targetR = 8;
      let startTime = null;

      await new Promise(resolve => {
        function shrink(time) {
          if (!startTime) startTime = time;
          let p = (time - startTime) / 1800; // Calm 1.8s
          if (p > 1) p = 1;
          const ease = 0.5 - Math.cos(p * Math.PI) / 2;
          moon.radius = startR - (startR - targetR) * ease;
          if (p < 1) requestAnimationFrame(shrink);
          else resolve();
        }
        requestAnimationFrame(shrink);
      });

      // Pause 5s silently
      await sleep(5000);

      // Camera pan down 1/3 height
      currentState = STATES.CAMERA_PANNING;
      targetCameraOffsetY = -height * 0.28;
      
      let panStartTime = null;
      await new Promise(resolve => {
        function pan(time) {
          if (!panStartTime) panStartTime = time;
          let p = (time - panStartTime) / 3500; // Smooth 3.5s pan
          if (p > 1) p = 1;
          const ease = 0.5 - Math.cos(p * Math.PI) / 2; // Ease in-out
          cameraOffsetY = targetCameraOffsetY * ease;
          if (p < 1) requestAnimationFrame(pan);
          else resolve();
        }
        requestAnimationFrame(pan);
      });

      // Pause 2s showing silhouettes
      await sleep(2000);

      // Start 10s Fireworks Show
      currentState = STATES.FIREWORKS_SHOW;
      const fireworkInterval = setInterval(() => {
        if (currentState === STATES.FIREWORKS_SHOW) {
          launchRandomFirework();
        }
      }, 700);

      await sleep(10000);
      clearInterval(fireworkInterval);

      // 3s Quiet Pause
      currentState = STATES.FIREWORKS_PAUSE;
      await sleep(3000);

      // Love Forever Grand Burst
      currentState = STATES.LOVE_FOREVER_BURST;
      launchLoveForeverBurst();

      await sleep(5000);

      // Ending Screen Fade In
      currentState = STATES.ENDING_TEXT;
      endingText1.style.opacity = '1';
      await sleep(3000);
      endingText1.style.opacity = '0';
      await sleep(1500);
      endingText2.style.opacity = '1';
    }

    // --- FIREWORKS & PARTICLE PHYSICS ---
    function launchRandomFirework() {
      const startX = width * 0.2 + Math.random() * width * 0.6;
      const targetY = height * 0.15 + Math.random() * height * 0.25 - cameraOffsetY;
      const colors = ['#fde047', '#f43f5e', '#38bdf8', '#a855f7', '#34d399', '#fb923c'];
      
      fireworks.push({
        x: startX,
        y: height - cameraOffsetY,
        targetY: targetY,
        speed: Math.random() * 3 + 7,
        color: colors[Math.floor(Math.random() * colors.length)],
        exploded: false
      });
    }

    function createExplosion(x, y, color) {
      const particleCount = 60;
      for (let i = 0; i < particleCount; i++) {
        const angle = (Math.PI * 2 / particleCount) * i + Math.random() * 0.2;
        const speed = Math.random() * 5 + 2;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color: color,
          alpha: 1,
          decay: Math.random() * 0.015 + 0.01,
          gravity: 0.08
        });
      }
    }

    function launchLoveForeverBurst() {
      // Launch multiple rockets in unison
      for (let i = -3; i <= 3; i++) {
        fireworks.push({
          x: width / 2 + i * 40,
          y: height - cameraOffsetY,
          targetY: height * 0.22 - cameraOffsetY,
          speed: 9,
          color: '#fef08a',
          exploded: false,
          isTextRocket: i === 0
        });
      }
    }

    function createTextParticles(cx, cy) {
      // Offscreen canvas to sample text "LOVE FOREVER"
      const tCanvas = document.createElement('canvas');
      const tCtx = tCanvas.getContext('2d');
      tCanvas.width = 800;
      tCanvas.height = 200;
      
      tCtx.fillStyle = '#ffffff';
      tCtx.font = 'bold 70px "Quicksand", sans-serif';
      tCtx.textAlign = 'center';
      tCtx.textBaseline = 'middle';
      tCtx.fillText('LOVE FOREVER', 400, 100);

      const imgData = tCtx.getImageData(0, 0, 800, 200);
      const data = imgData.data;

      // Sample pixels to form particles
      const step = 6;
      for (let y = 0; y < 200; y += step) {
        for (let x = 0; x < 800; x += step) {
          const index = (y * 800 + x) * 4;
          if (data[index + 3] > 128) {
            const px = cx + (x - 400) * (width < 640 ? 0.75 : 1.1);
            const py = cy + (y - 100) * (width < 640 ? 0.75 : 1.1);
            
            particles.push({
              x: cx,
              y: cy,
              targetX: px,
              targetY: py,
              vx: (px - cx) * 0.08 + (Math.random() - 0.5) * 2,
              vy: (py - cy) * 0.08 + (Math.random() - 0.5) * 2,
              color: '#fef08a',
              alpha: 1,
              decay: 0.006,
              gravity: 0.015,
              isText: true
            });
          }
        }
      }
    }

    // --- MAIN RENDER LOOP ---
    function render(timestamp) {
      ctx.clearRect(0, 0, width, height);

      // Save context for camera pan
      ctx.save();
      ctx.translate(0, cameraOffsetY);

      // 1. Draw Stars
      for (let s of stars) {
        s.alpha += Math.sin(timestamp * s.twinkleSpeed) * 0.01;
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0.1, Math.min(1, s.alpha))})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      }

      // 2. Draw Moon
      if (moon.opacity > 0) {
        ctx.save();
        
        // Smooth hover dynamics. The state is locked permanently after clicking.
        const hoverTarget = (!moon.hoverLocked && moon.isHovered) ? 1 : 0;
        moon.hoverAmount = (moon.hoverAmount || 0) + (hoverTarget - (moon.hoverAmount || 0)) * 0.08;
        const currentR = moon.radius * (1 + moon.hoverAmount * 0.08);

        // Moon Glow
        const glowRadius = currentR * (currentState === STATES.MOON_GLOWING_UP ? 3.5 : 2.2) * (1 + moon.hoverAmount * 0.18);
        const glowGradient = ctx.createRadialGradient(moon.x, moon.y, currentR * 0.5, moon.x, moon.y, glowRadius);
        const hoverGlow = moon.hoverAmount * 0.18;
        glowGradient.addColorStop(0, `rgba(254, 240, 138, ${moon.glowOpacity + hoverGlow})`);
        glowGradient.addColorStop(0.5, `rgba(253, 224, 71, ${(moon.glowOpacity + hoverGlow) * 0.3})`);
        glowGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

        ctx.fillStyle = glowGradient;
        ctx.beginPath();
        ctx.arc(moon.x, moon.y, glowRadius, 0, Math.PI * 2);
        ctx.fill();

        // Moon Solid
        const moonGradient = ctx.createRadialGradient(
          moon.x - currentR * 0.3, 
          moon.y - currentR * 0.3, 
          currentR * 0.1, 
          moon.x, 
          moon.y, 
          currentR
        );
        moonGradient.addColorStop(0, '#ffffff');
        moonGradient.addColorStop(0.75, '#fef08a');
        moonGradient.addColorStop(1, '#fde047');

        ctx.fillStyle = moonGradient;
        ctx.globalAlpha = moon.opacity;
        ctx.beginPath();
        ctx.arc(moon.x, moon.y, currentR, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 3. Draw Lanterns
      if (currentState === STATES.INTERACTIVE_SKY || currentState === STATES.WAITING_LANTERNS_CLEAR) {
        for (let i = lanterns.length - 1; i >= 0; i--) {
          const l = lanterns[i];
          // Calm vertical drift only: no horizontal wobble, no rotation.
          l.y -= l.speedY;

          // Render Lantern
          ctx.save();
          ctx.globalAlpha = l.opacity;
          ctx.translate(l.x, l.y);

          // Lantern Glow
          const lGlow = ctx.createRadialGradient(0, 0, 2, 0, 0, l.size * 1.8);
          lGlow.addColorStop(0, 'rgba(251, 146, 60, 0.8)');
          lGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
          ctx.fillStyle = lGlow;
          ctx.beginPath();
          ctx.arc(0, 0, l.size * 1.8, 0, Math.PI * 2);
          ctx.fill();

          // Lantern Body
          ctx.fillStyle = '#f97316';
          ctx.beginPath();
          ctx.roundRect(-l.size * 0.5, -l.size * 0.65, l.size, l.size * 1.3, 6);
          ctx.fill();

          // Inner Light
          ctx.fillStyle = '#fef08a';
          ctx.beginPath();
          ctx.arc(0, 0, l.size * 0.3, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();

          // Recycle/Remove offscreen lanterns
          if (l.y < -60) {
            if (currentState === STATES.INTERACTIVE_SKY) {
              // Reuse the same horizontal lane and send it far below the screen.
              l.y = height + 160 + (l.index % 5) * 55;
            } else {
              lanterns.splice(i, 1);
            }
          }
        }

        // Check if all lanterns cleared in WAITING state
        if (currentState === STATES.WAITING_LANTERNS_CLEAR && lanterns.length === 0) {
          currentState = STATES.MOON_GLOWING_UP;
          moon.glowOpacity = 0.18;
          const glowStart = performance.now();
          (function easeFinalMoonGlow() {
            const p = Math.min(1, (performance.now() - glowStart) / 4200);
            moon.glowOpacity = 0.18 + (1 - 0.18) * (0.5 - Math.cos(p * Math.PI) / 2);
            if (p < 1 && currentState === STATES.MOON_GLOWING_UP) requestAnimationFrame(easeFinalMoonGlow);
          })();
        }
      }

      // 4. Draw Fireworks & Particles
      for (let i = fireworks.length - 1; i >= 0; i--) {
        const fw = fireworks[i];
        fw.y -= fw.speed;

        ctx.strokeStyle = fw.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(fw.x, fw.y + 10);
        ctx.lineTo(fw.x, fw.y);
        ctx.stroke();

        if (fw.y <= fw.targetY) {
          if (fw.isTextRocket) {
            createTextParticles(fw.x, fw.y);
          } else {
            createExplosion(fw.x, fw.y, fw.color);
          }
          fireworks.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.alpha -= p.decay;

        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.isText ? 1.8 : 2.2, 0, Math.PI * 2);
        ctx.fill();

        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }

      // 5. Draw Silhouettes (Revealed after camera pan)
      if (cameraOffsetY < 0) {
        ctx.save();
        const baseGroundY = height + Math.abs(targetCameraOffsetY) - 10;

        // Hill slope
        ctx.fillStyle = '#020617';
        ctx.beginPath();
        ctx.ellipse(width / 2, baseGroundY + 120, width * 0.7, 160, 0, Math.PI, 0);
        ctx.fill();

        // Two Silhouettes Sitting Together
        const centerX = width / 2;
        const groundY = baseGroundY - 20;

        ctx.fillStyle = '#090d16';

        // Person 1 (Left - Head & Torso leaning right)
        ctx.beginPath();
        ctx.arc(centerX - 16, groundY - 42, 10, 0, Math.PI * 2); // Head
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(centerX - 14, groundY - 18, 14, 22, 0.15, 0, Math.PI * 2); // Body
        ctx.fill();

        // Person 2 (Right - Head leaning on Person 1 shoulder)
        ctx.beginPath();
        ctx.arc(centerX + 6, groundY - 38, 9, 0, Math.PI * 2); // Head
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(centerX + 8, groundY - 16, 13, 20, -0.1, 0, Math.PI * 2); // Body
        ctx.fill();

        ctx.restore();
      }

      ctx.restore();
      requestAnimationFrame(render);
    }

    // Start App Sequence
    window.onload = () => {
      runIntroTypewriter();
      requestAnimationFrame(render);
    };
  </script>
</body>
</html>
