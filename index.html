<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đêm Trăng & Pháo Hoa I Love You</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh;
            overflow: hidden;
            background: #02050e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        .sky-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, #1b2735 0%, #02050e 100%);
            z-index: 1;
        }

        #fireworks-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 5;
            pointer-events: none;
        }

        #moon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            z-index: 20;
            width: 360px;
            height: 360px;
            border-radius: 50%;
            cursor: pointer;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #fff3a0 50%, #fbc531 100%);
            box-shadow: 0 0 40px rgba(251, 197, 49, 0.4);
            filter: brightness(1);
            transition: filter 3s ease, 
                        box-shadow 3s ease, 
                        transform 5s cubic-bezier(0.4, 0, 0.2, 1), 
                        top 3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        #moon:hover {
            filter: brightness(1.5);
            box-shadow: 0 0 100px #fff, 0 0 140px #fbc531;
        }

        #moon.is-clicked {
            filter: brightness(1.5) !important;
            box-shadow: 0 0 100px #fff, 0 0 140px #fbc531 !important;
            cursor: default;
        }

        #moon.shrink {
            transform: translate(-50%, -50%) scale(0.43) !important;
        }

        #moon.move-up {
            top: 22% !important;
        }

        #bottom-scene {
            position: fixed;
            bottom: 0; left: 0;
            width: 100vw;
            height: 38vh;
            z-index: 15;
            opacity: 0;
            transition: opacity 2.5s ease;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        #bottom-scene.show { opacity: 1; }

        .ground-base {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(to top, #02050e 40%, rgba(2, 5, 14, 0.8) 80%, transparent 100%);
        }

        .couple-silhouette {
            position: relative;
            z-index: 16;
            margin-bottom: -10px;
        }

        #hint {
            position: fixed;
            bottom: 40px;
            color: #ffeaa7;
            font-size: 1.1rem;
            z-index: 30;
            pointer-events: none;
            opacity: 0.8;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

    <div class="sky-bg"></div>
    <canvas id="fireworks-canvas"></canvas>

    <div id="moon" onclick="startSequence()"></div>

    <div id="bottom-scene">
        <div class="ground-base"></div>
        <svg class="couple-silhouette" width="340" height="220" viewBox="0 0 340 220">
            <path d="M 0,220 Q 170,170 340,220 Z" fill="#1e293b"/>
            <circle cx="130" cy="85" r="28" fill="#1e293b"/>
            <path d="M 70,220 C 70,140 100,120 145,120 C 175,120 185,150 185,220 Z" fill="#1e293b"/>
            <circle cx="182" cy="98" r="24" fill="#1e293b"/>
            <path d="M 150,220 C 150,150 170,135 210,138 C 240,148 245,180 255,220 Z" fill="#1e293b"/>
        </svg>
    </div>

    <div id="hint">Rê chuột làm sáng 3s, click vào Mặt Trăng để bắt đầu</div>

    <script>
        const moon = document.getElementById('moon');
        const hint = document.getElementById('hint');
        const bottomScene = document.getElementById('bottom-scene');
        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let isStarted = false;

        function startSequence() {
            if (isStarted) return;
            isStarted = true;

            moon.classList.add('is-clicked');
            hint.style.opacity = '0';

            setTimeout(() => {
                moon.classList.add('shrink');

                setTimeout(() => {
                    moon.classList.add('move-up');
                    bottomScene.classList.add('show');

                    setTimeout(() => {
                        startFireworksPhase1();
                    }, 4000);

                }, 5000 + 2000);

            }, 3000);
        }

        let particles = [];
        let rockets = [];

        function animate() {
            requestAnimationFrame(animate);
            ctx.fillStyle = 'rgba(2, 5, 14, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = rockets.length - 1; i >= 0; i--) {
                rockets[i].update();
                rockets[i].draw();
                if (rockets[i].exploded) {
                    rockets.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }
        animate();

        class Rocket {
            constructor(startX, startY, targetX, targetY, isTextRocket = false) {
                this.x = startX;
                this.y = startY;
                this.targetX = targetX;
                this.targetY = targetY;
                this.speed = 13;
                this.angle = Math.atan2(targetY - startY, targetX - startX);
                this.vx = Math.cos(this.angle) * this.speed;
                this.vy = Math.sin(this.angle) * this.speed;
                this.exploded = false;
                this.isTextRocket = isTextRocket;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (Math.hypot(this.targetX - this.x, this.targetY - this.y) < 15) {
                    this.exploded = true;
                    if (this.isTextRocket) {
                        explodeTextDirect(); // Nổ trực tiếp ra chữ luôn!
                    } else {
                        explodeNormal(this.x, this.y);
                    }
                }
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = '#ffeaa7';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#fff';
                ctx.fill();
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color, vx, vy, friction = 0.95, gravity = 0.08) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = vx;
                this.vy = vy;
                this.alpha = 1;
                this.friction = friction;
                this.gravity = gravity;
            }

            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.008; // Bay mờ chậm hơn cho chữ hiện lâu
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        function explodeNormal(x, y) {
            const colors = ['#ff7675', '#fd79a8', '#ffeaa7', '#74b9ff', '#55efc4', '#a29bfe'];
            const count = 50 + Math.floor(Math.random() * 30);
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 8 + 2;
                const color = colors[Math.floor(Math.random() * colors.length)];
                particles.push(new Particle(x, y, color, Math.cos(angle) * speed, Math.sin(angle) * speed));
            }
        }

        let phase1Count = 0;
        function startFireworksPhase1() {
            if (phase1Count >= 10) {
                setTimeout(() => {
                    startFireworksPhase2();
                }, 1000);
                return;
            }

            const waveRockets = 3 + Math.floor(Math.random() * 4);
            for (let i = 0; i < waveRockets; i++) {
                setTimeout(() => {
                    const startX = canvas.width * (0.15 + Math.random() * 0.7);
                    const targetX = startX + (Math.random() * 100 - 50);
                    const targetY = canvas.height * (0.2 + Math.random() * 0.3);
                    rockets.push(new Rocket(startX, canvas.height, targetX, targetY));
                }, i * 200);
            }

            phase1Count++;
            setTimeout(startFireworksPhase1, 1500);
        }

        // BẮN 10 QUẢ ĐỒNG LOẠT NỔ BÙNG THÀNH CHỮ "I LOVE YOU"
        let textExploded = false;
        function startFireworksPhase2() {
            textExploded = false;
            const rocketCount = 10;
            for (let i = 0; i < rocketCount; i++) {
                const startX = canvas.width * (0.1 + (i / (rocketCount - 1)) * 0.8);
                const targetX = startX;
                const targetY = canvas.height * 0.45;
                // Quả đầu tiên bay tới đích sẽ kích hoạt hiệu ứng nổ tạo chữ ngay lập tức
                const isTrigger = (i === 0);
                rockets.push(new Rocket(startX, canvas.height, targetX, targetY, isTrigger));
            }
        }

        // NỔ PHÁT RA CHỮ LẬP TỨC
        function explodeTextDirect() {
            if (textExploded) return;
            textExploded = true;

            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = 900;
            tempCanvas.height = 200;

            tempCtx.font = 'bold 95px "Segoe UI", Arial, sans-serif';
            tempCtx.fillStyle = '#ffffff';
            tempCtx.textAlign = 'center';
            tempCtx.textBaseline = 'middle';
            tempCtx.fillText('I LOVE YOU', 450, 100);

            const imgData = tempCtx.getImageData(0, 0, 900, 200);
            const centerX = canvas.width / 2;
            const centerY = canvas.height * 0.45;

            for (let y = 0; y < 200; y += 4) {
                for (let x = 0; x < 900; x += 4) {
                    const index = (y * 900 + x) * 4;
                    if (imgData.data[index + 3] > 128) {
                        const px = centerX + (x - 450);
                        const py = centerY + (y - 100);
                        
                        // Lực nổ nhẹ tỏa từ điểm chữ ra xung quanh
                        const angle = Math.random() * Math.PI * 2;
                        const speed = Math.random() * 2.5;
                        const colors = ['#ff7675', '#fd79a8', '#ffeaa7', '#ffffff', '#fdcb6e'];
                        const color = colors[Math.floor(Math.random() * colors.length)];
                        
                        particles.push(new Particle(
                            px, py, color, 
                            Math.cos(angle) * speed, 
                            Math.sin(angle) * speed, 
                            0.94, 0.03
                        ));
                    }
                }
            }
        }
    </script>
</body>
</html>
