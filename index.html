<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kịch Bản Đêm Trăng Trung Thu</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh;
            overflow: hidden;
            background: #02050e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        /* BẦU TRỜI SAO NỀN CỐ ĐỊNH */
        .sky-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, #1b2735 0%, #02050e 100%);
            z-index: 1;
        }

        /* KHỐI TRÒN MẶT TRĂNG */
        #moon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            width: 380px;
            height: 380px;
            border-radius: 50%;
            cursor: pointer;
            
            /* Ánh sáng ban đầu */
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #fff3a0 50%, #fbc531 100%);
            box-shadow: 0 0 40px rgba(251, 197, 49, 0.4);
            filter: brightness(1);

            /* Transition hỗ trợ di chuyển vị trí và đổi độ sáng mượt mà */
            transition: filter 3s ease, box-shadow 3s ease, top 3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* RÊ CHUỘT LẠI GẦN: SÁNG TỪ TỪ LÊN TRONG 3S */
        #moon:hover {
            filter: brightness(1.5);
            box-shadow: 0 0 100px #fff, 0 0 140px #fbc531;
        }

        /* GIỮ NGUYÊN ĐỘ SÁNG KHI ĐÃ CLICK */
        #moon.is-clicked {
            filter: brightness(1.5) !important;
            box-shadow: 0 0 100px #fff, 0 0 140px #fbc531 !important;
            cursor: default;
        }

        /* TRẠNG THÁI BAY LÊN 1/3 TRÊN MÀN HÌNH */
        #moon.move-up {
            top: 25% !important; /* Vị trí 1/3 phía trên */
        }

        /* CẢNH 1/3 DƯỚI MÀN HÌNH: ĐẤT VÀ 2 BÓNG NGƯỜI TỰA VÀO NHAU */
        #bottom-scene {
            position: fixed;
            bottom: 0; left: 0;
            width: 100vw;
            height: 35vh; /* 1/3 dưới màn hình */
            z-index: 5;
            opacity: 0;
            transition: opacity 2.5s ease;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        #bottom-scene.show {
            opacity: 1;
        }

        /* MẢNH ĐẤT NỀN DƯỚI */
        .ground-base {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(to top, #02050e 40%, rgba(2, 5, 14, 0.8) 80%, transparent 100%);
        }

        /* HÌNH BÓNG 2 NGƯỜI TỰA VÀO NHAU */
        .couple-silhouette {
            position: relative;
            z-index: 6;
            margin-bottom: 20px;
        }

        /* HƯỚNG DẪN BẤM */
        #hint {
            position: fixed;
            bottom: 40px;
            color: #ffeaa7;
            font-size: 1.1rem;
            z-index: 20;
            pointer-events: none;
            opacity: 0.8;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

    <div class="sky-bg"></div>

    <!-- MẶT TRĂNG -->
    <div id="moon" onclick="startSequence()"></div>

    <!-- CẢNH DƯỚI MÀN HÌNH (BÓNG 2 NGƯỜI) -->
    <div id="bottom-scene">
        <div class="ground-base"></div>
        <svg class="couple-silhouette" width="160" height="120" viewBox="0 0 160 120">
            <!-- Người bên trái -->
            <circle cx="65" cy="35" r="14" fill="#02050e"/>
            <path d="M 40,120 C 40,70 55,55 75,55 C 80,55 85,70 85,120 Z" fill="#02050e"/>
            
            <!-- Người bên phải nghiêng đầu tựa vào -->
            <circle cx="88" cy="40" r="12" fill="#02050e"/>
            <path d="M 75,120 C 75,75 85,65 105,67 C 115,77 110,95 115,120 Z" fill="#02050e"/>
        </svg>
    </div>

    <div id="hint">Rê chuột để làm sáng, click vào Mặt Trăng để bắt đầu</div>

    <script>
        const moon = document.getElementById('moon');
        const hint = document.getElementById('hint');
        const bottomScene = document.getElementById('bottom-scene');

        let currentSize = 380;       // Đường kính ban đầu
        const targetSize = 180;      // Dừng lại ở kích thước vừa phải (180px)
        let isStarted = false;

        function startSequence() {
            if (isStarted) return;
            isStarted = true;

            // 1. Giữ nguyên độ sáng rực rỡ và ẩn dòng hướng dẫn
            moon.classList.add('is-clicked');
            hint.style.opacity = '0';

            // 2. Đợi đúng 3 giây sau khi click mới bắt đầu thu nhỏ
            setTimeout(() => {
                requestAnimationFrame(shrinkMoon);
            }, 3000);
        }

        // Lập trình thu nhỏ mượt mà từng pixel
        function shrinkMoon() {
            if (currentSize > targetSize) {
                currentSize -= 0.8; // Tốc độ giảm cực mịn

                moon.style.width = currentSize + 'px';
                moon.style.height = currentSize + 'px';

                requestAnimationFrame(shrinkMoon);
            } else {
                // Đảm bảo dừng chuẩn ở kích thước vừa phải
                moon.style.width = targetSize + 'px';
                moon.style.height = targetSize + 'px';

                // 3. Sau khi thu nhỏ xong, dừng lại đúng 2 giây
                setTimeout(() => {
                    // 4. Từ từ bay lên 1/3 phía trên màn hình
                    moon.classList.add('move-up');

                    // 5. Đồng thời để lộ ra 2 bóng người ngồi tựa vào nhau phía dưới
                    bottomScene.classList.add('show');
                }, 2000);
            }
        }
    </script>
</body>
</html>
