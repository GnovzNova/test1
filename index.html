<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Fireworks Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Config pháo hoa chuẩn physics
        const GRAVITY = 0.08;
        const FRICTION = 0.96;

        let fireworks = [];
        let particles = [];

        const COLOR_PALETTES = [
            ['#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#3742fa'],
            ['#ffffff', '#ffeaa7', '#fdcb6e', '#e17055'],
            ['#00e5ff', '#6c5ce7', '#a29bfe', '#fd79a8'],
            ['#55efc4', '#81ecec', '#74b9ff', '#ffeaa7']
        ];

        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        class Firework {
            constructor(startX, startY, targetX, targetY) {
                this.x = startX;
                this.y = startY;
                this.startX = startX;
                this.startY = startY;
                this.targetX = targetX;
                this.targetY = targetY;
                this.distanceToTarget = Math.hypot(targetX - startX, targetY - startY);
                this.distanceTraveled = 0;

                this.angle = Math.atan2(targetY - startY, targetX - startX);
                this.speed = random(8, 12);
                this.trail = [];
                this.trailLength = 5;

                this.palette = COLOR_PALETTES[Math.floor(Math.random() * COLOR_PALETTES.length)];
            }

            update(index) {
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > this.trailLength) {
                    this.trail.shift();
                }

                const vx = Math.cos(this.angle) * this.speed;
                const vy = Math.sin(this.angle) * this.speed;

                this.x += vx;
                this.y += vy;

                this.distanceTraveled = Math.hypot(this.x - this.startX, this.y - this.startY);

                if (this.distanceTraveled >= this.distanceToTarget) {
                    createExplosion(this.targetX, this.targetY, this.palette);
                    fireworks.splice(index, 1);
                }
            }

            draw() {
                ctx.beginPath();
                if (this.trail.length > 0) {
                    ctx.moveTo(this.trail[0].x, this.trail[0].y);
                    ctx.lineTo(this.x, this.y);
                }
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.angle = random(0, Math.PI * 2);
                this.speed = random(1, 10);
                this.friction = FRICTION;
                this.gravity = GRAVITY;
                this.color = color;
                this.alpha = 1;
                this.decay = random(0.01, 0.02);
                this.trail = [];
                this.trailLength = Math.floor(random(8, 15)); // Đuôi dài mượt
            }

            update(index) {
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > this.trailLength) {
                    this.trail.shift();
                }

                this.speed *= this.friction;
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed + this.gravity;
                this.alpha -= this.decay;

                if (this.alpha <= 0) {
                    particles.splice(index, 1);
                }
            }

            draw() {
                ctx.beginPath();
                if (this.trail.length > 0) {
                    ctx.moveTo(this.trail[0].x, this.trail[0].y);
                    for (let i = 1; i < this.trail.length; i++) {
                        ctx.lineTo(this.trail[i].x, this.trail[i].y);
                    }
                }
                ctx.strokeStyle = this.color;
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.lineWidth = random(1, 2.5);
                ctx.stroke();
                ctx.globalAlpha = 1;
            }
        }

        function createExplosion(x, y, palette) {
            const particleCount = Math.floor(random(80, 150));
            for (let i = 0; i < particleCount; i++) {
                const color = palette[Math.floor(Math.random() * palette.length)];
                particles.push(new Particle(x, y, color));
            }
        }

        // Tự động bắn ngẫu nhiên
        let timer = 0;
        function loop() {
            requestAnimationFrame(loop);

            // Mẹo tạo vệt mờ hậu cảnh (Trail effect) chuẩn đét
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
            ctx.fillRect(0, 0, width, height);

            ctx.globalCompositeOperation = 'lighter';

            fireworks.forEach((fw, i) => fw.update(i));
            fireworks.forEach(fw => fw.draw());

            particles.forEach((p, i) => p.update(i));
            particles.forEach(p => p.draw());

            timer++;
            if (timer % 20 === 0) {
                const startX = width / 2 + random(-width * 0.3, width * 0.3);
                const targetX = random(width * 0.1, width * 0.9);
                const targetY = random(height * 0.1, height * 0.5);
                fireworks.push(new Firework(startX, height, targetX, targetY));
            }
        }

        // Click chuột để bắn pháo hoa tại vị trí chọn
        canvas.addEventListener('click', (e) => {
            const startX = width / 2;
            fireworks.push(new Firework(startX, height, e.clientX, e.clientY));
        });

        loop();
    </script>
</body>
</html>
