<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trung Thu ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #02020a;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            user-select: none;
        }

        canvas.bg-stars {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* ----- 1. MÀN TRĂNG ----- */
        #moon-screen {
            position: fixed;
            width: 100vw; height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 1.2s ease, visibility 1.2s ease;
        }

        .moon-wrapper {
            position: relative;
            cursor: pointer;
            text-align: center;
        }

        .moon {
            width: 200px; height: 200px;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #fff3a0 50%, #fbc531 100%);
            border-radius: 50%;
            box-shadow: 
                0 0 30px #fff,
                0 0 60px #fbc531,
                0 0 120px rgba(251, 197, 49, 0.5),
                inset -20px -20px 50px rgba(0,0,0,0.3);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin: 0 auto;
        }

        .moon-wrapper:hover .moon {
            transform: scale(1.1);
            box-shadow: 
                0 0 50px #fff,
                0 0 100px #fbc531,
                0 0 180px rgba(251, 197, 49, 0.8);
        }

        .hint-text {
            margin-top: 30px;
            font-size: 1rem;
            letter-spacing: 2px;
            color: #e1b12c;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(225, 177, 44, 0.5);
        }

        /* ----- 2. MÀN NGƯỜI NHẢY ----- */
        #dance-screen {
            position: fixed;
            width: 100vw; height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0; visibility: hidden;
            transition: opacity 1s ease, visibility 1s ease;
            z-index: 5;
        }

        .dancer-container {
            position: relative;
            cursor: pointer;
            text-align: center;
        }

        .dancer-svg {
            width: 180px; height: 240px;
            filter: drop-shadow(0 0 15px #fbc531);
            animation: danceMove 1.2s ease-in-out infinite alternate;
            transform-origin: bottom center;
        }

        .dancer-hint {
            margin-top: 20px;
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: #ffeaa7;
            text-shadow: 0 0 10px rgba(255, 234, 167, 0.8);
        }

        @keyframes danceMove {
            0% { transform: translateY(0) rotate(-5deg) scaleY(1); }
            50% { transform: translateY(-15px) rotate(0deg) scaleY(1.03); }
            100% { transform: translateY(0) rotate(5deg) scaleY(1); }
        }

        /* ----- 3. MÀN PHÁO HOA ----- */
        #fireworks-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            opacity: 0; visibility: hidden;
            transition: opacity 1.5s ease;
            z-index: 20;
            background: #02020a;
        }

        canvas.fireworks-canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <canvas class="bg-stars" id="starsCanvas"></canvas>

    <!-- MÀN 1: TRĂNG -->
    <div id="moon-screen">
        <div class="moon-wrapper" id="moonBtn">
            <div class="moon"></div>
            <div class="hint-text">Chạm vào Mặt Trăng ✨</div>
        </div>
    </div>

    <!-- MÀN 2: NGƯỜI NHẢY -->
    <div id="dance-screen">
        <div class="dancer-container" id="dancerBtn">
            <svg class="dancer-svg" viewBox="0 0 100 150">
                <!-- Đầu -->
                <circle cx="50" cy="25" r="12" fill="#ffeaa7" />
                <path d="M 40 20 Q 50 10 60 20 Q 65 35 50 38 Q 35 35 40 20 Z" fill="#2d3436" />
                <!-- Thân/Váy -->
                <path d="M 50 37 L 35 75 L 65 75 Z" fill="#ff7675" />
                <path d="M 35 75 Q 50 95 65 75 L 80 115 Q 50 130 20 115 Z" fill="#fd79a8" />
                <!-- Tay -->
                <path d="M 43 45 Q 25 35 15 50" stroke="#ffeaa7" stroke-width="4" stroke-linecap="round" fill="none" />
                <path d="M 57 45 Q 75 35 85 50" stroke="#ffeaa7" stroke-width="4" stroke-linecap="round" fill="none" />
                <!-- Chân -->
                <line x1="42" y1="120" x2="38" y2="145" stroke="#ffeaa7" stroke-width="4" stroke-linecap="round" />
                <line x1="58" y1="120" x2="62" y2="145" stroke="#ffeaa7" stroke-width="4" stroke-linecap="round" />
            </svg>
            <div class="dancer-hint">Chạm vào em nè! 💃</div>
        </div>
    </div>

    <!-- MÀN 3: PHÁO HOA -->
    <div id="fireworks-screen">
        <canvas class="fireworks-canvas" id="fireworksCanvas"></canvas>
    </div>

    <script>
        // --- BẦU TRỜI SAO ---
        const starsCanvas = document.getElementById('starsCanvas');
        const sCtx = starsCanvas.getContext('2d');
        let stars = [];

        function resizeStars() {
            starsCanvas.width = window.innerWidth;
            starsCanvas.height = window.innerHeight;
            stars = [];
            for(let i=0; i<150; i++) {
                stars.push({
                    x: Math.random() * starsCanvas.width,
                    y: Math.random() * starsCanvas.height,
                    size: Math.random() * 1.5,
                    alpha: Math.random(),
                    speed: Math.random() * 0.02 + 0.005
                });
            }
        }
        window.addEventListener('resize', resizeStars);
        resizeStars();

        function renderStars() {
            sCtx.clearRect(0, 0, starsCanvas.width, starsCanvas.height);
            stars.forEach(s => {
                s.alpha += s.speed;
                if(s.alpha > 1 || s.alpha < 0) s.speed = -s.speed;
                sCtx.fillStyle = `rgba(255, 255, 255, ${Math.abs(s.alpha)})`;
                sCtx.beginPath();
                sCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                sCtx.fill();
            });
            requestAnimationFrame(renderStars);
        }
        renderStars();

        // --- BƯỚC 1 -> BƯỚC 2: CLICK TRĂNG MOON ---
        const moonScreen = document.getElementById('moon-screen');
        const danceScreen = document.getElementById('dance-screen');
        const fireworksScreen = document.getElementById('fireworks-screen');

        document.getElementById('moonBtn').addEventListener('click', () => {
            moonScreen.style.opacity = '0';
            moonScreen.style.visibility = 'hidden';

            setTimeout(() => {
                danceScreen.style.visibility = 'visible';
                danceScreen.style.opacity = '1';
            }, 1000);
        });

        // --- BƯỚC 2 -> BƯỚC 3: CLICK NGƯỜI NHẢY DANCER ---
        document.getElementById('dancerBtn').addEventListener('click', () => {
            danceScreen.style.opacity = '0';
            danceScreen.style.visibility = 'hidden';

            setTimeout(() => {
                fireworksScreen.style.visibility = 'visible';
                fireworksScreen.style.opacity = '1';
                initFireworks();
            }, 1000);
        });

        // --- BƯỚC 3: PHÁO HOA TẠO CHỮ "Em Thích Chị ❤️" ---
        function initFireworks() {
            const canvas = document.getElementById('fireworksCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            let rockets = [];
            let particles = [];
            let timer = 0;
            let showText = false;

            const GRAVITY = 0.08;
            const FRICTION = 0.96;
            const PALETTES = [
                ['#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#3742fa'],
                ['#ffffff', '#ffeaa7', '#fdcb6e', '#e17055'],
                ['#00e5ff', '#6c5ce7', '#a29bfe', '#fd79a8']
            ];

            function random(min, max) { return Math.random() * (max - min) + min; }

            class Rocket {
                constructor(targetX, targetY) {
                    this.x = canvas.width / 2 + random(-150, 150);
                    this.y = canvas.height;
                    this.startX = this.x;
                    this.startY = this.y;
                    this.targetX = targetX;
                    this.targetY = targetY;
                    this.distanceToTarget = Math.hypot(targetX - this.startX, targetY - this.startY);
                    this.distanceTraveled = 0;
                    this.angle = Math.atan2(targetY - this.y, targetX - this.x);
                    this.speed = random(9, 13);
                    this.trail = [];
                    this.trailLength = 6;
                    this.palette = PALETTES[Math.floor(Math.random() * PALETTES.length)];
                }

                update() {
                    this.trail.push({ x: this.x, y: this.y });
                    if (this.trail.length > this.trailLength) this.trail.shift();

                    this.x += Math.cos(this.angle) * this.speed;
                    this.y += Math.sin(this.angle) * this.speed;
                    this.distanceTraveled = Math.hypot(this.x - this.startX, this.y - this.startY);

                    if (this.distanceTraveled >= this.distanceToTarget) {
                        explode(this.targetX, this.targetY, this.palette);
                        return false;
                    }
                    return true;
                }

                draw() {
                    ctx.beginPath();
                    if (this.trail.length > 0) {
                        ctx.moveTo(this.trail[0].x, this.trail[0].y);
                        ctx.lineTo(this.x, this.y);
                    }
                    ctx.strokeStyle = '#ffeaa7';
                    ctx.lineWidth = 2.5;
                    ctx.stroke();
                }
            }

            class Particle {
                constructor(x, y, color, targetX = null, targetY = null) {
                    this.x = x; 
                    this.y = y;
                    this.color = color;
                    this.targetX = targetX; 
                    this.targetY = targetY;

                    this.angle = random(0, Math.PI * 2);
                    this.speed = random(1, 10);
                    this.friction = FRICTION;
                    this.gravity = GRAVITY;
                    this.alpha = 1;
                    this.decay = random(0.012, 0.022);
                    this.trail = [];
                    this.trailLength = Math.floor(random(6, 12));
                }

                update() {
                    if (this.targetX !== null) {
                        this.x += (this.targetX - this.x) * 0.07;
                        this.y += (this.targetY - this.y) * 0.07;
                    } else {
                        this.trail.push({ x: this.x, y: this.y });
                        if (this.trail.length > this.trailLength) this.trail.shift();

                        this.speed *= this.friction;
                        this.x += Math.cos(this.angle) * this.speed;
                        this.y += Math.sin(this.angle) * this.speed + this.gravity;
                        this.alpha -= this.decay;
                    }
                }

                draw() {
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, this.alpha);
                    
                    if (this.targetX !== null) {
                        ctx.fillStyle = this.color;
                        ctx.shadowBlur = 8;
                        ctx.shadowColor = this.color;
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        ctx.beginPath();
                        if (this.trail.length > 0) {
                            ctx.moveTo(this.trail[0].x, this.trail[0].y);
                            for (let i = 1; i < this.trail.length; i++) {
                                ctx.lineTo(this.trail[i].x, this.trail[i].y);
                            }
                        }
                        ctx.strokeStyle = this.color;
                        ctx.lineWidth = random(1, 2.2);
                        ctx.stroke();
                    }
                    ctx.restore();
                }
            }

            function explode(x, y, palette) {
                const count = Math.floor(random(80, 140));
                for (let i = 0; i < count; i++) {
                    particles.push(new Particle(x, y, palette[Math.floor(Math.random() * palette.length)]));
                }
            }

            function createTextParticles() {
                const offCanvas = document.createElement('canvas');
                const offCtx = offCanvas.getContext('2d');
                offCanvas.width = canvas.width;
                offCanvas.height = canvas.height;

                const fontSize = Math.min(canvas.width / 9, 65);
                offCtx.font = `bold ${fontSize}px 'Dancing Script', cursive`;
                offCtx.fillStyle = '#fbc531';
                offCtx.textAlign = 'center';
                offCtx.fillText('Em Thích Chị ❤️', canvas.width / 2, canvas.height / 2);

                const data = offCtx.getImageData(0, 0, canvas.width, canvas.height).data;
                const step = canvas.width < 500 ? 4 : 5;
                for (let y = 0; y < canvas.height; y += step) {
                    for (let x = 0; x < canvas.width; x += step) {
                        if (data[(y * canvas.width + x) * 4 + 3] > 128) {
                            particles.push(new Particle(canvas.width / 2, canvas.height / 2, '#ffeaa7', x, y));
                        }
                    }
                }
            }

            function loop() {
                requestAnimationFrame(loop);

                ctx.globalCompositeOperation = 'destination-out';
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.globalCompositeOperation = 'lighter';

                timer++;
                if (timer < 200 && timer % 20 === 0) {
                    rockets.push(new Rocket(
                        random(canvas.width * 0.15, canvas.width * 0.85),
                        random(canvas.height * 0.1, canvas.height * 0.5)
                    ));
                }

                rockets = rockets.filter(r => {
                    r.draw();
                    return r.update();
                });

                if (timer === 220 && !showText) {
                    showText = true;
                    particles = [];
                    createTextParticles();
                }

                particles.forEach((p, index) => {
                    p.update();
                    p.draw();
                    if (p.alpha <= 0 && p.targetX === null) particles.splice(index, 1);
                });
            }

            loop();
        }
    </script>
</body>
</html>
