<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đêm Trăng Mượt Mà - 5 Giây</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh;
            overflow: hidden;
            background: #02050e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        /* BẦU TRỜI SAO NỀN CỐ ĐỊNH */
        .sky-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, #1b2735 0%, #02050e 100%);
            z-index: 1;
        }

        /* KHỐI TRÒN MẶT TRĂNG */
        #moon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            width: 360px;
            height: 360px;
            border-radius: 50%;
            cursor: pointer;
            
            /* Ánh sáng ban đầu */
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #fff3a0 50%, #fbc531 100%);
            box-shadow: 0 0 40px rgba(251, 197, 49, 0.4);
            filter: brightness(1);

            /* Transition 5 GIÂY THU NHỎ SIÊU MƯỢT */
            transition: filter 3s ease, 
                        box-shadow 3s ease, 
                        width 5s cubic-bezier(0.25, 1, 0.5, 1), 
                        height 5s cubic-bezier(0.25, 1, 0.5, 1), 
                        top 3.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* RÊ CHUỘT LẠI GẦN: SÁNG TỪ TỪ LÊN ĐÚNG 3S */
        #moon:hover {
            filter: brightness(1.5);
            box-shadow: 0 0 100px #fff, 0 0 140px #fbc531;
        }

        /* GIỮ NGUYÊN ĐỘ SÁNG RỰC RỠ KHI ĐÃ CLICK */
        #moon.is-clicked {
            filter: brightness(1.5) !important;
            box-shadow: 0 0 100px #fff, 0 0 140px #fbc531 !important;
            cursor: default;
        }

        /* KHI THU NHỎ BÁN KÍNH TRONG 5S */
        #moon.shrink {
            width: 158px !important;
            height: 158px !important;
        }

        /* KHI BAY LÊN 1/3 TRÊN MÀN HÌNH */
        #moon.move-up {
            top: 25% !important;
        }

        /* CẢNH 1/3 DƯỚI MÀN HÌNH: CẬN CẢNH VAI TỰA VÀO NHAU */
        #bottom-scene {
            position: fixed;
            bottom: 0; left: 0;
            width: 100vw;
            height: 38vh;
            z-index: 5;
            opacity: 0;
            transition: opacity 2.5s ease;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        #bottom-scene.show {
            opacity: 1;
        }

        /* MẢNH ĐẤT NỀN DƯỚI */
        .ground-base {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(to top, #060a14 30%, rgba(6, 10, 20, 0.8) 75%, transparent 100%);
        }

        /* BÓNG 2 NGƯỜI TO CẬN CẢNH (HAI VAI TỰA VÀO NHAU) */
        .couple-silhouette {
            position: relative;
            z-index: 6;
            margin-bottom: -10px;
            filter: drop-shadow(0 -5px 15px rgba(255, 243, 160, 0.25));
        }

        /* HƯỚNG DẪN BẤM */
        #hint {
            position: fixed;
            bottom: 40px;
            color: #ffeaa7;
            font-size: 1.1rem;
            z-index: 20;
            pointer-events: none;
            opacity: 0.8;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

    <div class="sky-bg"></div>

    <!-- MẶT TRĂNG -->
    <div id="moon" onclick="startSequence()"></div>

    <!-- CẢNH BÓNG 2 NGƯỜI TO CẬN CẢNH (CHỈ HIỆN 2 VAI TỰA NHAU) -->
    <div id="bottom-scene">
        <div class="ground-base"></div>
        <svg class="couple-silhouette" width="340" height="220" viewBox="0 0 340 220">
            <!-- Đồi đất cong nhẹ -->
            <path d="M 0,220 Q 170,170 340,220 Z" fill="#090f1d"/>
            
            <!-- Người bên trái (Vai to & Đầu) -->
            <circle cx="130" cy="85" r="28" fill="#11192b"/>
            <!-- Phần vai rộng tựa sang phải -->
            <path d="M 70,220 C 70,140 100,120 145,120 C 175,120 185,150 185,220 Z" fill="#11192b"/>
            
            <!-- Người bên phải nghiêng đầu tựa hẳn vào vai người trái -->
            <circle cx="182" cy="98" r="24" fill="#11192b"/>
            <!-- Phần vai nghiêng sát vào -->
            <path d="M 150,220 C 150,150 170,135 210,138 C 240,148 245,180 255,220 Z" fill="#11192b"/>
        </svg>
    </div>

    <div id="hint">Rê chuột làm sáng 3s, click vào Mặt Trăng để thu nhỏ</div>

    <script>
        const moon = document.getElementById('moon');
        const hint = document.getElementById('hint');
        const bottomScene = document.getElementById('bottom-scene');

        let isStarted = false;

        function startSequence() {
            if (isStarted) return;
            isStarted = true;

            // 1. Giữ nguyên độ sáng rực rỡ và ẩn chữ hướng dẫn
            moon.classList.add('is-clicked');
            hint.style.opacity = '0';

            // 2. Đợi đúng 3s phát sáng rực rỡ rồi bắt đầu thu nhỏ trong 5s mượt mà
            setTimeout(() => {
                moon.classList.add('shrink');

                // 3. Sau khi thu nhỏ xong (5s), dừng nghỉ 2s
                setTimeout(() => {
                    // 4. Từ từ bay lên 1/3 phía trên
                    moon.classList.add('move-up');

                    // 5. Đồng thời hiện rõ hình bóng 2 người cận cảnh vai tựa vào nhau
                    bottomScene.classList.add('show');
                }, 2000);

            }, 3000);
        }
    </script>
</body>
</html>
